description: >-
  Defines a Wavelength product where handoff is made on Ethernet interface of
  the transponders. It requires 2 Place relationships: one with
  "role=INSTALL_LOCATION_A" and second with "role=INSTALL_LOCATION_Z"
type: object
properties:
  name:
    type: string
    description: Buyer settable unique name of the Wavelength Connection
  portSpeed:
    type: string
    description:
      Specifies Port Speed. It is limited by technology, thus provided as enum.
    enum:
      - 1G
      - 10G
      - 100G
      - 400G
      - 800G
  protectionType:
    type: string
    description: Specifies whether a Protected or Unprotected path is required
    enum:
      - PROTECTED
      - UNPROTECTED
  encryption:
    type: boolean
    description: Specifies whether encryption is required
  pathRouting:
    type: string
    description:
      Specifies whether a Standard or Customer Defined routing is required
    enum:
      - STANDARD
      - CUSTOMER_DEFINED
  aPhysicalInterface:
    description: >-
      Describes the cable and connector to be used at the a-side.
    $ref: '#/definitions/PhysicalInterface'
  zPhysicalInterface:
    description: >-
      Describes the cable and connector to be used at the z-side.
    $ref: '#/definitions/PhysicalInterface'
required:
  - name
  - pathRouting
  - protectionType
  - encryption
  - portSpeed
definitions:
  PhysicalInterface:
    description: >-
      Describes the Patch Panel Interface in the Cross-Connection.
    type: object
    properties:
      identifier:
        description: >-
          The Cross-Connection PatchPanel Interface Identifier Attribute
          uniquely identifies the PatchPanel Interface at one end of the
          Cross-Connection.
      type: string
      cableType:
        description: |
          - Enumeration representing the cable type
          - For a Type-0 Cross-Connection the values of the CableType parameters MUST be the same at each Cross-Connection PatchPanel Interface 
          - For Type-1 and Type-2 Cross-Connections the value of the CableType parameter MAY be different at each Cross-Connection PatchPanel Interface.
        $ref: '#/definitions/CableType'
      connectorType:
        description: |
          - Enumeration representing type of connector
          - For a Type-0 Cross-Connection the values of the connectorType parameters MUST be the same at each Cross-Connection PatchPanel Interface
          - For Type-1 and Type-2 Cross-Connections the value of the connectorType parameter MAY be different at each Cross-Connection PatchPanel Interface.
        $ref: '#/definitions/ConnectorTypeXc'
  CableType:
    description: Cable Type
    enum:
      - 'CAT_5_ETHERNET'
      - 'CAT_5E_ETHERNET'
      - 'CAT_6_ETHERNET'
      - 'CAT_6E_ETHERNET'
      - 'SINGLE_MODE_FIBER'
      - 'MULTI_MODE_FIBER_50_MICRON_CORE'
      - 'MULTI_MODE_FIBER_52.5_MICRON_CORE'
    type: string
  ConnectorTypeXc:
    description:
      Enumeration representing type of connector presented to Subscriber.
    type: string
    enum:
      - 'RJ45'
      - 'SC'
      - 'LC'
