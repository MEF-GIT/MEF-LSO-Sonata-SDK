description: >-
  An association of SD-WAN Connection End Points in an SD-WAN Service
  that provides the logical construct of a L3 Virtual Private Routed Network
  for a Subscriber. SdWanConnection is a resource that represents a
  SD-WAN  Connection. Reference MEF 70.2 Section 9  SD-WAN Virtual
  Connection (SWVC) Service Attribute.
type: object
properties:
  name:
    type: string
    description: Buyer settable unique name of the SD-WAN Connection
  bandwidth:
    description: >-
      (NONSTD) The overall bandwidth. TODO - what exactly does that technically
      mean?
    $ref: '../../../common/common.yaml#/definitions/InformationRate'
  features:
    description: >-
      Indicates the major functional and protocol features provided by
      the SD-WAN Product
    type: array
    items:
      $ref: '#/definitions/SdWanConnectionFeatures'
    uniqueItems: true
  topology:
    description: >-
      The type of provided virtual topology. 
    enum:
      - FULL_MESH
      - HUB_SPOKE
required:
  - name
  - topology
definitions:
  SdWanConnectionFeatures:
    description:
      Major functional and protocol features provided by the SD-WAN
      Connection.
    enum:
      - SECURITY
      - MIDDLE_BOX_FUNCTION
      - TBD
    type: string
