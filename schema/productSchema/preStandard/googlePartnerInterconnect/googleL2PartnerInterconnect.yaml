properties:
  name:
    description: The name of the new connection, provided by the Buyer
    type: string
  capacity:
    description: The bandwidth of VLAN attachment.
    $ref: '#/definitions/GooglePartnerInterconnectCapacityEnum'
  vlanAttachments:
    description:
      A set of parameters needed to configura VLAN attachemnts by the Service
      Provider
    type: array
    items:
      $ref: '#/definitions/GoogleVlanAttachment'
    minItems: 2
    maxItems: 4
required:
  - name
  - capacity
  - vlanAttachments
definitions:
  GooglePartnerInterconnectCapacityEnum:
    description:
    enum:
      - '50 Mbps'
      - '100 Mbps'
      - '200 Mbps'
      - '300 Mbps'
      - '400 Mbps'
      - '500 Mbps'
      - '1 Gbps'
      - '2 Gbps'
      - '5 Gbps'
      - '10 Gbps'
      - '20 Gbps'
      - '50 Gbps'
    type: string
  GoogleVlanAttachment:
    type: object
    description:
      The region and pairing key of the VLAN Attachment.
    properties:
      region:
        description:
          The region that you select must be supported by a Partner
          Interconnect location, which is a city where the service provider's
          network meets Google Cloud's network. Traffic between your Virtual
          Private Cloud (VPC) network and the service provider's network passes
          through this location. Typically, you would choose a location that's
          close to your data center to reduce the latency to your Google Cloud
          workloads. Each service provider location supports only some regions.
          Check with your service provider to determine which regions each
          location supports.
        type: string
      pairingKey:
        description:
          This pairing key is generated when you create the VLAN attachment.
        type: string
    required:
      - region
      - pairingKey

