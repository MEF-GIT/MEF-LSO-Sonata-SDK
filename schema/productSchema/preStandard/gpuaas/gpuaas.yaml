properties:
  manufacturerIdentifier:
    $ref: '../edgeCompute/common.yaml#/definitions/IdentifierOrUnspecified'
    description: The Manufacturer Identifier.
  modelIdentifier:
    $ref: '../edgeCompute/common.yaml#/definitions/IdentifierOrUnspecified'
    description: Manufacturer model identifier.
  packageType:
    $ref: '../edgeCompute/common.yaml#/definitions/PackageType'
    description: 'The access to the processor provided. '
  processorType:
    $ref: '../edgeCompute/common.yaml#/definitions/ProcessorType'
    description:
      Specifies the architecture and machine language of the processor.
  clockSpeedRange:
    description: 'Specifies the minimum and maximum speed of the processor.'
    $ref: '../edgeCompute/common.yaml#/definitions/ClockSpeedRange'
  numberOfCores:
    $ref: '../edgeCompute/common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
    description: 'Specifies the number of cores supported by the processor. '
  numberOfThreads:
    $ref: '../edgeCompute/common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
    description:
      'Specifies the number of threads that the processor supports. '
  level1CacheSize:
    $ref: '../edgeCompute/common.yaml#/definitions/CacheSize'
    description:
      Specifies the size of the level 1 cache that the processor supports.
  level2CacheSize:
    $ref: '../edgeCompute/common.yaml#/definitions/CacheSize'
    description:
      Specifies the size of the level 2 cache that the processor supports.
  instructionsPerClockCycle:
    $ref: '../edgeCompute/common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
    description:
      Specifies the the number of machine instructions executed per clock cycle
      by the processor. Its value is an integer > 0 in thousands or
      Unspecified.
  memory:
    $ref: '../edgeCompute/common.yaml#/definitions/Memory'
    description: Specifies the memory. Added for Project Mongoose.
  gpu:
    $ref: '#/definitions/GPU'
definitions:
  GPU:
    description: GPU resource specification for IaaS.
    type: object
    properties:
      manufacturerIdentifier:
        $ref: '../edgeCompute/common.yaml#/definitions/IdentifierOrUnspecified'
      modelIdentifier:
        $ref: '../edgeCompute/common.yaml#/definitions/IdentifierOrUnspecified'
      memorySize:
        $ref: '../edgeCompute/common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
      clockSpeedRange:
        $ref: '../edgeCompute/common.yaml#/definitions/ClockSpeedRange'
      numberOfCores:
        $ref: '../edgeCompute/common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
      numberOfThreads:
        $ref: '../edgeCompute/common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
      cudaCores:
        type: integer
        description: The number of CUDA cores for parallel computing.
      tensorCores:
        type: integer
        minimum: 0
        description: The number of Tensor Cores in the GPU.
      performanceProfile:
        $ref: '#/definitions/GpuPerformanceProfile'
      supportedFrameworks:
        items:
          $ref: '#/definitions/GpuSupportedFrameworks'
        type: array
      vram:
        type: integer
        description: The video memory available on the GPU.
      driverVersion:
        type: string
        description: The required GPU driver version.
      location:
        $ref: '#/definitions/GpuCloudEdgeLocation'
  GpuCloudEdgeLocation:
    type: object
    properties:
      type:
        $ref: '#/definitions/CloudEdgeType'
      region:
        type: string
        description: Region (e.g., 'North America', 'Europe').
      site:
        type: string
        description: Specific site within the region (e.g., 'New York', 'London').
      availabilityZone:
        type: string
        description: Availability zone (cloud-specific).
  CloudEdgeType:
    enum:
    - CLOUD
    - EDGE
    type: string
  GpuPerformanceProfile:
    enum:
    - HIGH_PERFORMANCE_COMPUTING
    - DEEP_LEARNING_INFERENCE
    - DATA_SCIENCE
    type: string
  GpuSupportedFrameworks:
    enum:
    - TENSOR_FLOW
    - PY_TORCH
    - CUDA
    - MX_NET
    type: string