---
type: object
$id: urn:mef:xid:spec:cantata-sonata:virtual-machine-with-gpuaas:v0.0.1:all
$schema: http://json-schema.org/draft-07/schema#
description:
  Product Specification schema for IaaS Virtual Machine, extended to include
  GPU as a Service (GPUaaS). Reference MEF W132 Section 8.14 Virtual Machine
  Requirements. Product relationship with role `INTERFACES_TO` pointing to
  Network.
title:
  MEF LSO IaaS Virtual Machine with GPUaaS
