description:
  The building block solution for Edge Bare Metal. Reference MEF W132. Product
  relationship with role `INTERFACES_TO` pointing to Network. Place
  relationship with role `INSTALL_LOCATION`
type: object
properties:
  processor:
    $ref: '#/definitions/Processor'
    description:
      IaaS Host Operating System. Reference MEF W132 Section 8.3 Processor
      Service Attributes.
  memory:
    $ref: './common.yaml#/definitions/Memory'
    description: IaaS Memory resource. Reference MEF W132 Section 8.4 Memory.
  storage:
    $ref: './storage.yaml'
    description:
      IaaS Host Storage System. Reference MEF W132 Section 8.5 Storage.
  guestOs:
    $ref: './guestOs.yaml'
    description:
      IaaS Guest Operating System. Reference MEF W132 Section 8.12 Guest OS.
definitions:
  Processor:
    type: object
    description:
      IaaS Host Operating System. Reference MEF W132 Section 8.3 Processor
      Service Attributes
    properties:
      manufacturerIdentifier:
        $ref: './common.yaml#/definitions/IdentifierOrUnspecified'
        description:
          The Processor Manufacturer. Reference MEF W132 Section 8.3.1
          Manufacturer Identifier Service Attribute.
      modelIdentifier:
        $ref: './common.yaml#/definitions/IdentifierOrUnspecified'
        description:
          Manufacturer model identifier. Reference MEF W132 Section 8.3.2
          Manufacturer Model Identifier Service Attribute.
      packageType:
        description: The access to the processor provided.
        $ref: './common.yaml#/definitions/PackageType'
      processorType:
        $ref: './common.yaml#/definitions/ProcessorType'
        description:
          Specifies the architecture and machine language of the processor.
          Reference MEF W132 Section 8.3.3 Processor Type Service Attribute.
      clockSpeedRange:
        description:
          Specifies the minimum and maximum speed of the processor. Reference
          MEF W132 Section 8.3.4 Clock Speed Range Service Attribute.
        $ref: './common.yaml#/definitions/ClockSpeedRange'
      numberOfCores:
        $ref: './common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
        description:
          Specifies the number of cores supported by the processor. Reference
          MEF W132 Section 8.3.5 Number of Cores Service Attribute.
      numberOfThreads:
        $ref: './common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
        description:
          Specifies the number of threads that the processor supports.
          Reference MEF W132 Section 8.3.6 Number of Threads Service Attribute.
      instructionsPerClockCycle:
        $ref: './common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
        description:
          Specifies the the number of machine instructions executed per clock
          cycle by the processor. Its value is an integer > 0 in thousands or
          Unspecified. Reference MEF W132 Section 8.3.9 Instructions per Clock
          Cycle Service Attribute.
    title: MEF LSO IaaS Processor
