definitions:
  CacheSize:
    description: The cache size that the processor supports.
    minProperties: 1
    maxProperties: 1
    properties:
      memorySize:
        $ref: '#/definitions/IntegerOrUnspecifiedGtZero'
        description:
          The amount of memory in GiBytes. Reference MEF W132 Section 8.4.1
          Memory Amount Service Attribute.
      unspecified:
        type: string
        enum:
          - UNSPECIFIED
  ClockSpeedRange:
    type: object
    description:
      Specifies the minimum and maximum clock speed of the processor. Each
      value in [GHz]
    properties:
      minimum:
        $ref: '#/definitions/NumberOrUnspecifiedGtZero'
      maximum:
        $ref: '#/definitions/NumberOrUnspecifiedGtZero'
  IdentifierOrUnspecified:
    type: object
    description: An Identifier String or explicit "Unspecified."
    properties:
      identifier:
        $ref: '../../../common/common.yaml#/definitions/IdentifierString'
      unspecified:
        type: string
        enum:
          - UNSPECIFIED
  IntegerOrUnspecifiedGtZero:
    type: object
    description: An integer > 0 or explicit "Unspecified"
    properties:
      value:
        type: number
        minimum: 0
      unspecified:
        type: string
        enum:
          - UNSPECIFIED
  Memory:
    type: object
    description: IaaS Memory resource. Reference MEF W132 Section 8.4 Memory.
    properties:
      amount:
        $ref: './common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
        description:
          The amount of memory in GiBytes. Reference MEF W132 Section 8.4.1
          Memory Amount Service Attribute.
      accessTime:
        $ref: '#/definitions/MemoryTime'
        description:
          The Memory Access Time used to specify the time it takes to perform a
          read or write operation in memory.  Reference MEF W132 Section 8.4.2
          Memory Access Time Service Attribute.
      cycleTime:
        $ref: '#/definitions/MemoryTime'
        description:
          The Memory Cycle Time used to specify the duration between the
          initiations of two successive RAM operations. Reference MEF W132
          Section 8.4.3 Memory Cycle Time Service Attribute.
      transferRate:
        $ref: './common.yaml#/definitions/NumberOrUnspecifiedGtZero'
        description:
          The Memory Transfer Rate in [GB/s] used to specify the speed of
          reading or writing data in memory location. Reference MEF W132
          Section 8.4.4 Memory Transfer Rate.
  MemoryTime:
    type: object
    description:
      The memory access time to perform a read or write operation in memory.
    properties:
      value:
        type: integer
        description: The value in the data size.
      units:
        $ref: '#/definitions/UnitsNanoMicroSeconds'
  NumberOrUnspecifiedGtZero:
    type: object
    description: A real number > 0 or explicit "Unspecified"
    properties:
      value:
        type: number
        minimum: 0
      unspecified:
        type: string
        enum:
          - UNSPECIFIED
  PackageType:
    type: string
    description: 'The access to the processor provided. '
    enum:
      - BINARY
      - SOURCE
  ProcessorType:
    type: string
    description:
      Specifies the architecture and machine language of the processor.
      Reference MEF W132 Section 8.3.3 Processor Type Service Attribute.
    enum:
      - X86
      - ARM
      - OTHER
      - UNSPECIFIED
  UnitsNanoMicroSeconds:
    description: The unit of measure in time. Nano and micro seconds only.
    enum:
      - NANOSECONDS
      - MICROSECONDS
    type: string
