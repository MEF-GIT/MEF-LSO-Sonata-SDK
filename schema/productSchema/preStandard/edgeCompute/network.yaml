properties:
  cloudUni:
    $ref: '#/definitions/CloudUni'
    description:
      The demarcation point marking the boundary between the responsibility of
      the Cloud Subscriber and the Cloud Service Provider.
  cloudVcEndPoint:
    $ref: '#/definitions/CloudVcEndPoint'
    description:
      A logical construct at a Cloud UNI, or Cloud Application Interface to
      which a subnet  of the Cloud Service Protocol Data Units (PDUs) passing
      over that interface is mapped.
  cloudVc:
    $ref: '#/definitions/CloudVc'
    description: An association of two or more Cloud VC End Points.
definitions:
  CloudUni:
    type: object
    description:
      The demarcation point marking the boundary between the responsibility of
      the Cloud Subscriber and the Cloud Service Provider. Reference MEF W132
      Section 8.17 Cloud UNI. NOTE - Future work.
    properties:
      identifier:
        $ref: '../../../common/common.yaml#/definitions/IdentifierString'
        description: The unique identifier of the Cloud UNI.
      ipv4ConnectionAddressing:
        $ref: '../../../common/ip/ipCommon.yaml#/definitions/UniIpv4ConnectionAddressing'
        description: IPv4 allocation
      ipv6ConnectionAddressing:
        $ref: '../../../common/ip/ipCommon.yaml#/definitions/UniIpv6ConnectionAddressing'
        description: IPv6 allocation
    title: MEF LSO IaaS Cloud UNI
  CloudVc:
    type: object
    description:
      An association of two or more Cloud Virtual Circuit End Points.
    properties:
      connectivity:
        $ref: '#/definitions/Connectivity'
        description:
          Reference MEF W132 Section 8.18.2.2 Connectivity Service Attributes.
    title: MEF LSO IaaS Cloud Virtual Circuit
  Access:
    type: object
    description:
      The Access attributes to gain access to the subscriber's Edge Computing
      IaaS.
    properties:
      uri:
        type: string
        format: uri
        description:
          A description of a URL with possible values following the URI format
          specified in Section 2.7.2 of RFC 7230.
      accessIdentifier:
        $ref: '../../../common/common.yaml#/definitions/IdentifierString128'
        description:
          The unique characters that make up the Edge IaaS Instance Identifier
          used by the Subscriber to access the Edge IaaS.
      accessCredentials:
        $ref: '../../../common/common.yaml#/definitions/IdentifierString128'
        description:
          The unique characters that make up the Edge IaaS Instance User Access
          Credentials used by the Subscriber to access the Edge IaaS.
  CloudVcEndPoint:
    type: object
    description:
      A logical construct at a Cloud UNI, or Cloud Application Interface to
      which a subset of the Cloud Service Protocol Date Units (PDUs) passing
      over that interface is mapped.
    properties:
      identifier:
        $ref: '../../../common/common.yaml#/definitions/IdentifierString'
        description: The unique identifier of the Cloud UNI.
      cloudApplicationInterface:
        type: array
        description:
          The demarcation point between a Cloud Application and one or more
          Cloud VC End Points.
        items:
          $ref: '#/definitions/CloudApplicationInterface'
        minItems: 1
    title: MEF LSO IaaS Cloud Virtual Circuit End Point
  CloudApplicationInterface:
    type: object
    description:
      The demarcation point between a Cloud Application and one or more Cloud
      VC End Points.
    properties:
      entityIdentifier:
        $ref: '../../../common/common.yaml#/definitions/IdentifierString'
        description: The unique identifier of the Cloud Application Interface.
      addressing:
        $ref: '../../../common/ip/ipCommon.yaml#/definitions/Ipv4OrIpv6Address'
        description:
          Identify the IP address that is used to connect to Edge Computing
          IaaS.
      access:
        $ref: '#/definitions/Access'
        description:
          Access by the Subscriber to the Edge Computing IaaS is described with
          the Access Service Attributes.
      cloudApplication:
        type: array
        description:
          The demarcation point between a Cloud Application and one or more
          Cloud VC End Points.
        items:
          $ref: '../../../common/common.yaml#/definitions/IdentifierString'
        minItems: 1
    title: MEF LSO IaaS Cloud Application Interface
  Connectivity:
    type: object
    description:
      Defines the parties that are connected by the Subscriber Cloud VC.
    properties:
      cloudVcConnectionType:
        type: string
        enum:
          - EDGE_COMPUTE_IAAS_CLOUD_VC
      cloudVcConnectionEndPointList:
        type: array
        items:
          $ref: '../../../common/common.yaml#/definitions/IdentifierString'
        minItems: 1
      cloudVcConnectionProtectionType:
        type: string
