properties:
  manufacturerIdentifier:
    $ref: './common.yaml#/definitions/IdentifierOrUnspecified'
    description:
      The Processor Manufacturer. Reference MEF W132 Section 8.3.1 Manufacturer
      Identifier Service Attribute.
  modelIdentifier:
    $ref: './common.yaml#/definitions/IdentifierOrUnspecified'
    description:
      Manufacturer model identifier. Reference MEF W132 Section 8.3.2
      Manufacturer Model Identifier Service Attribute.
  packageType:
    $ref: './common.yaml#/definitions/PackageType'
    description: 'The access to the processor provided. '
  processorType:
    $ref: './common.yaml#/definitions/ProcessorType'
    description:
      Specifies the architecture and machine language of the processor.
      Reference MEF W132 Section 8.3.3 Processor Type Service Attribute.
  clockSpeedRange:
    description: 'Specifies the minimum and maximum speed of the processor.'
    $ref: './common.yaml#/definitions/ClockSpeedRange'
  numberOfCores:
    $ref: './common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
    description: 'Specifies the number of cores supported by the processor. '
  numberOfThreads:
    $ref: './common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
    description:
      'Specifies the number of threads that the processor supports. '
  level1CacheSize:
    $ref: './common.yaml#/definitions/CacheSize'
    description:
      Specifies the size of the level 1 cache that the processor supports.
  level2CacheSize:
    $ref: './common.yaml#/definitions/CacheSize'
    description:
      Specifies the size of the level 2 cache that the processor supports.
  instructionsPerClockCycle:
    $ref: './common.yaml#/definitions/IntegerOrUnspecifiedGtZero'
    description:
      Specifies the the number of machine instructions executed per clock cycle
      by the processor. Its value is an integer > 0 in thousands or
      Unspecified.
  memory:
    $ref: './common.yaml#/definitions/Memory'
    description: Specifies the memory. Added for Project Mongoose.
