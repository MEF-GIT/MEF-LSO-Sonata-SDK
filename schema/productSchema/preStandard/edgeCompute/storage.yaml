properties:
  storageType:
    $ref: '#/definitions/StorageType'
    description: The Storage Type is used to specify the type of storage. Reference
      MEF W132 Section 8.5.1 Storage Type Service Attribute.
  classes:
    $ref: '#/definitions/StorageClasses'
    description: Specifies if the Storage is used for Standard purposes or Archival
      purposes.  Reference MEF W132 Section 8.5.2 Storage Classes Service Attribute.
  timeToAccess:
    type: integer
    minimum: 0
    description: Specifies the time required to access the Subscriber data that
      has been stored.  An integer > 0 in milliseconds. Reference MEF W132 Section
      8.5.3 Storage Class  Time to Access Service Attribute.
  archiveDuration:
    type: integer
    minimum: 0
    description: Specifies the amount of time in days that archived data will
      be stored. An  integer > 0 in days. Reference MEF W132 Section 8.5.4 Storage
      Archive Duration  Service Attribute.
  storageAmount:
    type: integer
    minimum: 0
    description: Specifies the amount of storage available. An integer > 0 in
      GBytes. Reference  MEF W132 Section 8.5.5 Storage Amount Service Attribute.
  replication:
    type: boolean
    description: Specifies if the stored data is replicated by the Service Provider.
      Reference MEF W132 Section 8.5.6.
definitions:
  StorageType:
    type: string
    description: The Storage Type is used to specify the type of storage. Reference
      MEF W132 Section 8.5.1 Storage Type Service Attribute.
    enum:
    - FILE
    - BLOCK
    - OBJECT
  StorageClasses:
    type: object
    description: Specifies the type of storage.
    properties:
      archival:
        type: string
        description: "A string that contains the location of the entity. Examples\
          \ are country, city, GIS coordinates, SP location identifier, or Destination\
          \ IP Address."
      storage:
        enum:
        - STANDARD