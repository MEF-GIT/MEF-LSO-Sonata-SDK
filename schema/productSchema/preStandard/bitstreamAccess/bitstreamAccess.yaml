properties:
  bvc:
    type: object
    description: Broadband Virtual Connection details
    $ref: '#/definitions/Bvc'
  ont:
    type: object
    description: ONT device details
    $ref: '#/definitions/Ont'
  comment:
    type: string
    description: This is the comment for the product
required:
  - bvc
definitions:
  Ont:
    type: object
    properties:
      id:
        type: string
        description: This is externally exchanged ONT id
        maxLength: 120
      ownership:
        type: string
        description:
          This attribute specifies ownership of ONT device that is exposing ONT
        enum:
          - 'PROVIDER'
          - 'OPERATOR'
          - 'END_CUSTOMER'
      deviceType:
        type: string
        description: This attribute specifies type of the device
        enum:
          - 'CPE'
          - 'STB'
          - 'SIM B2B'
          - 'SIM B2C'
          - 'PLC'
      serialNumber:
        type: string
        description: This is device serial number
        maxLength: 120
      barcode:
        type: string
        description: This is device barcode
        maxLength: 120
      model:
        type: string
        description: This is externally agreed device model
        maxLength: 256
      provisioningStatus:
        type: string
        description:
          This attribute specifies status of the provisioning process
        enum:
          - 'NEW'
          - 'COMPLETED'
          - 'FAILED'
      provisioningComment:
        type: string
        description:
          This field contains Operator comment for the provisioning process
          (e.g. error message)
        maxLength: 256
    required:
      - ownership
  Bvc:
    type: object
    properties:
      id:
        type: string
        description: This is externally externally exchanged BVC is
        maxLength: 120
      externalId:
        type: string
        description: Operator Service Id
        maxLength: 120
      actionExternalId:
        type: string
        description:
          Operator Identifier of the Service that should be transferred during
          the Transfer action OR New Operator Identifier of the Service that
          should be used in Service Id Change Action
        maxLength: 120
      sellerId:
        type: string
        description: Seller Service Id
        maxLength: 120
      enabledChannels:
        type: string
        enum:
          - 'ONE_POINT'
          - 'MULTI-POINT'
          - 'MULTI-POINT-LIGHT'
      slaLevel:
        type: string
        description: Service SLA
        enum:
          - 'STANDARD'
          - 'INCREASED_SLA_8H'
      upstreamBandwidthProfile:
        type: string
        description: This is bandwidth profile for the upstream connectivity
        maxLength: 20
      downstreamBandwidthProfile:
        type: string
        description: This is bandwidth profile for the downstream connectivity
        maxLength: 20
    required:
      - enabledChannels
      - upstreamBandwidthProfile
      - downstreamBandwidthProfile
