      - "25GBASE_CR_S"
      - "25GBASE_ER"
      - "25GBASE_SR"
      - "25GBASE_T"
      - "40GBASE_CR4"
      - "40GBASE_ER4"
      - "40GBASE_FR"
      - "40GBASE_LR4"
      - "40GBASE_R"
      - "40GBASE_SR4"
