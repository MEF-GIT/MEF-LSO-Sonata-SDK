      - "10PASS_TS"
      - "100BASE_BX10"
      - "100BASE_FX"
      - "100BASE_LX10"
      - "100BASE_T"
      - "100BASE_T1"
      - "100BASE_T2"
      - "100BASE_T4"
      - "100BASE_TX"
      - "100BASE_X"
      - "1000BASE_BX10"
      - "1000BASE_CX"
      - "1000BASE_LX"
      - "1000BASE_LX10"
      - "1000BASE_PX10"
      - "1000BASE_PX20"
      - "1000BASE_RHA"
      - "1000BASE_RHB"
      - "1000BASE_RHC"
      - "1000BASE_SX"
