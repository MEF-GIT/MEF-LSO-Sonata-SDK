definitions:
  CrossConnection_Common:
    description: >-
      Common attributes of all types of Cross Connections
    type: object
    properties:
      identifier:
        description: >-
          The Cross-Connection Identifier uniquely identifies the Cross-Connection Service
        $ref: "#/definitions/IdentifierString"
      aPatchPanelInterface:
        description: >-
          Describes the cable and connector to be used at the a-side Patch Panel Interface in the Cross-Connection.
        $ref: "#/definitions/CrossConnectionPatchPanelInterface"
      zPatchPanelInterface:
        description: >-
          Describes the cable and connector to be used at the z-side Patch Panel Interface in the Cross-Connection.
        $ref: "#/definitions/CrossConnectionPatchPanelInterface"
    required:
      - identifier
      - aPatchPanelInterface
      - zPatchPanelInterface
  CrossConnectionDeviceInterface:
    description: >-
      The Cross-Connection Device Interface Attribute describes the physical interface of a Device inside of Type-1 and Type-2 Cross-Connections
    properties:
      codingFunction:
        description: |
          Coding Function
          The value MUST be the same at each External Interface involved in a Cross-Connection
        $ref: "#/definitions/EthernetPhysicalLayer"
      connectorType:
        description: |
          Physical Connector Type
          The value  MAY be different at each External Interface involved  in a Type1 Cross-Connection.
        $ref: "#/definitions/ConnectorTypeXc"
    required:
      - codingFunction
      - connectorType
    type: object
  CrossConnectionPatchPanelInterface:
    description: >-
      Describes the Patch Panel Interface in the Cross-Connection.
    type: object
    properties:
      identifier:
        description: >-
          The Cross-Connection PatchPanel Interface Identifier Attribute uniquely identifies the PatchPanel Interface at one end of the Cross-Connection.
        $ref: "#/definitions/IdentifierString"
      cableType:
        description: |
          - Enumeration representing the cable type
          - For a Type-0 Cross-Connection the values of the CableType parameters MUST be the same at each Cross-Connection PatchPanel Interface 
          - For Type-1 and Type-2 Cross-Connections the value of the CableType parameter MAY be different at each Cross-Connection PatchPanel Interface.
        $ref: "#/definitions/CableType"
      connectorType:
        description: |
          - Enumeration representing type of connector
          - For a Type-0 Cross-Connection the values of the connectorType parameters MUST be the same at each Cross-Connection PatchPanel Interface
          - For Type-1 and Type-2 Cross-Connections the value of the connectorType parameter MAY be different at each Cross-Connection PatchPanel Interface.
        $ref: "#/definitions/ConnectorTypeXc"
    required:
      - identifier
      - cableType
      - connectorType
  CableType:
    description: Cable Type
    enum:
      - "CAT_5_ETHERNET"
      - "CAT_5E_ETHERNET"
      - "CAT_6_ETHERNET"
      - "CAT_6E_ETHERNET"
      - "SINGLE_MODE_FIBER"
      - "MULTI_MODE_FIBER_50_MICRON_CORE"
      - "MULTI_MODE_FIBER_52.5_MICRON_CORE"
    type: string
  ConnectorTypeXc:
    description: Enumeration representing type of connector presented to Subscriber.
    type: string
    enum:
      - "RJ45"
      - "SC"
      - "LC"
  EthernetPhysicalLayer:
    description:
      Enumeration representing the different Ethernet physical layers. Reference
      MEF 61.1.1 Table A1-4 Ethernet PHYs for UNI Access Link Trunks.
