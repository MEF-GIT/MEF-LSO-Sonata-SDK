properties:
  accessTechnologyConfiguration:
    $ref: '#/definitions/L2obAccessTechnologyConfiguration'
  additionalWorkDescription:
    type: string
    description: 'The description of additional work'
  bitstreamProfile:
    $ref: '#/definitions/L2obBitstreamProfile'
  bitstreamTransport:
    $ref: '#/definitions/L2obBitstreamTransport'
  care:
    $ref: '#/definitions/L2obCare'
  enni:
    $ref: '#/definitions/L2obEnni'
  installation:
    $ref: '#/definitions/L2obInstallation'
  isAppointmentRequired:
    type: boolean
    description:
      'Indicates if an appointment is required for the work specification. Set
      by Seller'
  remoteAUCID:
    type: string
    description:
      'Identifier of the Access Line generated by the Access Provider.'
definitions:
  L2obAccessProtocol:
    type: string
    enum:
      - '10G-EPON (802.3av)'
      - '10G-PON (G.987)'
      - 'B-PON (G.983)'
      - 'DPoE'
      - 'E-PON (802.3ah)'
      - 'GPON (G.984)'
      - 'Higher Speed PON (G.9804)'
      - 'NG-EPON (802.3ca)'
      - 'NG-PON2 (G.989)'
      - 'XGS-PON (G.9807)'
      - '25G-PON'
      - 'DOCSIS 3.0'
      - 'DOCSIS 3.1'
      - 'DOCSIS 4.0'
      - 'ADSL (G.992)'
      - 'VDSL (G.993)'
      - 'G.FAST'
      - '1-GE'
      - '2.5-GE'
      - '10-GE'
      - 'DVB-S2'
      - 'DVB-S2X'
  L2obAccessTechnology:
    type: string
    enum:
      - TAL
      - OAL
      - ADSL
      - VDSL
      - FTTC
      - FTTB
      - FTTP
      - HFC
  L2obAccessTechnologyConfiguration:
    type: object
    properties:
      technology:
        $ref: '#/definitions/L2obAccessTechnology'
      protocol:
        $ref: '#/definitions/L2obAccessProtocol'
      networkTermination:
        $ref: '#/definitions/L2obNetworkTerminationUnit'
  L2obAuthenticationMethod:
    type: string
    enum:
      - PPPOE_INTERMEDIATE_AGENT
      - DHCP_RELAY_AGENT
  L2obBandwidthProfile:
    type: object
    properties:
      pir:
        $ref: '../../../common/common.yaml#/definitions/BiDirSimpleBandwidth'
      cir:
        $ref: '../../../common/common.yaml#/definitions/BiDirSimpleBandwidth'
      air:
        $ref: '../../../common/common.yaml#/definitions/BiDirSimpleBandwidth'
      nominal:
        $ref: '../../../common/common.yaml#/definitions/BiDirSimpleBandwidth'
    required:
      - nominal
  L2obBitstreamProfile:
    type: object
    properties:
      uniVlanTag:
        $ref: '#/definitions/L2obVlanTagging'
      bandwidth:
        $ref: '#/definitions/L2obBandwidthProfile'
      authenticationMethod:
        $ref: '#/definitions/L2obAuthenticationMethod'
        description:
          'Authentication of the buyer (Service Provider) by Access Provider'
  L2obBitstreamTransport:
    type: object
    properties:
      enniVlanTag:
        $ref: '#/definitions/L2obVlanTagging'
      reversePoweringRequired:
        type: boolean
        description: 'Defines if the DSLAM needs to be reverse powered'
      reachType:
        $ref: '#/definitions/L2obReachType'
        description:
          'Authentication of the buyer (Service Provider) by Access Provider'
  L2obCare:
    type: object
    properties:
      careLevel:
        type: string
        description:
          'The care level for the main product. For example: Level 1, Level 2,
          Level 3.'
    required:
      - careLevel
  L2obEnni:
    description:
      'The External Network to Network Interface (ENNI) is a reference point
      defined by the Metro Ethernet Forum (MEF) that allows Ethernet services
      to be extended across multiple Operator MENs. The ENNI is the boundary
      between two Operator MENs that are operated as separate administrative
      domains.'
    type: object
    properties:
      numberOfLinks:
        type: integer
        description:
          'The number of physical or logical links available in the ENNI.'
      vlanTaggingScheme:
        type: string
        description:
          'The VLAN tagging scheme used in the ENNI. Examples include
          Single-tagged (C-TAG) or Double-tagged (S-TAG + C-TAG)
          configurations.'
      lacpSupport:
        type: boolean
        description:
          'Indicates whether Link Aggregation Control Protocol (LACP) is
          supported.'
      eNNIPhysicalLayer:
        type: string
        description:
          'Specifies the physical layer of the ENNI, such as Ethernet over
          fiber or copper.'
      protectionScheme:
        type: string
        description:
          'Defines the protection scheme used, such as 1+1 protection, shared
          protection, or no protection.'
      eNNIProductType:
        type: string
        description:
          'Specifies the type of ENNI product, such as point-to-point,
          multipoint, or another service type.'
      enniMaximumFrameSize:
        type: integer
        minimum: 1526
        description:
          'The maximum frame size (in bytes) supported by the ENNI, including
          room for VLAN tags.'
      darkFibreRequired:
        type: boolean
        description:
          'Indicates whether dark fiber is required for the ENNI connection.'
  L2obInstallation:
    type: object
    properties:
      namedEngineerRequired:
        type: boolean
        description:
          'Flag to indicate if a named engineer is required for installation'
      siteRiskAssessmentId:
        type: string
        description: 'Id of existing site risk assessment carried out'
      siteRiskAssessmentRequired:
        type: boolean
        description:
          'Is a site risk assessment required for the engineer visit'
      siteVisitServiceLevel:
        type: string
        description:
          'Is a site risk assessment required for the engineer visit. For
          example: Level 1, Level 2, Level 3.'
      siteVisitReason:
        type: string
        description:
          'Purpose of the site visit., for example: Standard, Advanced.'
      preapprovedAdditionalWork:
        $ref: '#/definitions/L2obPreapprovedAdditionalWork'
        description: |
          Additional work details. Use 'band' for band-based work, or 'threshold' for threshold-based work.
  L2obNetworkTerminationUnit:
    type: object
    description:
      'Description of the network termination handover point on the End
      Customer site.'
    properties:
      id:
        type: string
        description:
          'Identifier of the network termination handover point on the End
          Customer site.'
      portId:
        type: string
        description:
          'Identifier of the port of the network termination handover point on
          the End Customer site. The understanding of the value in this
          parameter should be agreed between Buyer and Seller'
      portLabel:
        type: string
        description:
          'The label on the port that is present on the physical endpoint
          present within customer premises'
      ntuType:
        $ref: '#/definitions/L2obNtuType'
        description:
          'Defines the type of the socket/device of the network termination
          handover point on the End Customer site.'
      handoverConnectorType:
        $ref: '#/definitions/L2obNtuHandoverConnectorType'
        description: |-
          Defines the type of the connector of the network termination handover point on the End Customer site. Currently supported values are: 
           * RJ-11: Registered Jack type 11
           RJ-45 FIXME: connectorInterfaceType or proper MEF name
      model:
        type: string
        description:
          'Defines the model of the socket/device of the network termination
          handover point on the End Customer site.'
      serialNumber:
        type: string
        description:
          'Defines the serial number of the socket/device of the network
          termination handover point on the End Customer site.'
  L2obNtuHandoverConnectorType:
    type: string
    enum:
      - RJ-11
      - RJ-45
      - F Type Coax
      - LC
      - SC
      - FC
      - TAE
      - MMD
      - E2000
  L2obNtuType:
    type: string
    enum:
      - ONT
      - MDU
      - xDSL Modem
      - RJ-11 Socket
      - RJ-45 Socket
  L2obPreapprovedAdditionalWork:
    type: object
    minProperties: 1
    maxProperties: 1
    properties:
      band:
        type: string
        description: "The band of additional work. For example: Band 1, Band 2, Band 3."
      threshold:
        $ref: '../../../common/common.yaml#/definitions/Money'
        description: "Threshold value for additional work."
    description: "Represents either a band or a threshold for preapproved additional work. Only one should be provided."
  L2obReachType:
    type: string
    enum:
      - LOCAL
      - NATIONAL
      - REGIONAL
  L2obVlanTagging:
    type: object
    properties:
      vlanTagging:
        $ref: '#/definitions/L2obVlanTaggingMethod'
        description:
          'Specifies the VLAN tagging method used. Single tagging means that
          the intention is to use a single VLAN tag. Double tagging means that
          the intention is to use two VLAN tags. In request if buyer do not
          specify the tag values these are assigned by the seller.'
      sTag:
        type: integer
        minimum: 1
        maximum: 4095
        description:
          'The S-Tag is used to identify the service instance in a VLAN-aware
          network. It is typically used in double tagging scenarios.'
      cTag:
        type: integer
        minimum: 1
        maximum: 4095
        description:
          'The C-Tag is used to identify the customer VLAN in a VLAN-aware
          network.'
    required:
      - vlanTagging
  L2obVlanTaggingMethod:
    type: string
    enum:
      - SINGLE_TAGGING
      - DOUBLE_TAGGING
      - NO_TAGGING
