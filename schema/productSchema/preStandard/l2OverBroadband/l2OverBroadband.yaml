type: object
$id: urn:mef:xid:spec:cantata-sonata:l2-over-broadband:v0.0.1:all
$schema: http://json-schema.org/draft-07/schema#
description: >
  Product Specification schema for Layer 2 over Broadband Additional work can
  be managed by charge or appoitnment and workorder processes.
title:
  MEF LSO Layer 2 over Broadband
