---
$id: urn:mplify:lso:spec:product:cross-connection-type0:v1.0.0:all
$schema: http://json-schema.org/draft-07/schema#
title: Mplify LSO Cross-Connection Type 0
description: >-
  **This file forms part of Mplify 189** 

  This API implements Business Requirements described in Mplify 176 -
  Cross-Connection Product Attributes. 

  Cross-Connection Type 0 is a Layer 0 physical fiber cross-connection between
  two demarcation points (A-Side and Z-Side) within a colocation facility. It
  represents an optical or electrical cable that does not terminate the
  physical layer (PHY). The cross-connection is placed by a third-party
  provider on behalf of the Buyer. Each side of the cross-connection is
  identified by a Connectivity Facility Assignment (CFA) specifying the
  physical location and interface, or by a Product Relationship referencing an
  existing product at that location. Reference: Mplify 176 - Cross-Connection
  Product Attributes.
type: object
