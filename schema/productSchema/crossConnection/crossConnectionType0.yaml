properties:
  aSideCfa:
    $ref: '#/definitions/ConnectivityFacilityAssignment'
    description: >-
      The A-Side Connectivity Facility Assignment. Describes the physical
      location and interface details for the A-Side termination point of the
      cross-connection. The A-Side CFA MUST be provided when the Buyer does not
      own the facility at this side (Use Case 1). Alternatively, the A-Side MAY
      be identified via a Product Relationship (Use Case 2).
  zSideCfa:
    $ref: '#/definitions/ConnectivityFacilityAssignment'
    description: >-
      The Z-Side Connectivity Facility Assignment. Describes the physical
      location and interface details for the Z-Side termination point of the
      cross-connection. The Z-Side CFA MUST be provided when the Buyer does not
      own the facility at this side (Use Case 1). Alternatively, the Z-Side MAY
      be identified via a Product Relationship (Use Case 2).
definitions:
  ConnectivityFacilityAssignment:
    description: >-
      A Connectivity Facility Assignment (CFA) identifies a specific physical
      termination point for one side of a cross-connection within a colocation
      facility. It includes the building identifier, the owning entity
      (tenant), the demarcation point (requested or assigned by the Seller),
      the physical interface specification, and optionally a Letter of
      Authorization (LOA) if the Buyer does not own the facility at this side.
    type: object
    properties:
      owningEntity:
        description: >-
          Identifies the colocation tenant within the data center facility.
          This is the entity that owns or leases the space where the
          cross-connection terminates on this side.
        type: string
      buildingId:
        description: >-
          The unique identifier of the building (data center or colocation
          facility) where this side of the cross-connection is located. This
          identifier is typically assigned by the facility operator.
        type: string
      requestedDemarcationPoint:
        description: >-
          The demarcation point requested by the Buyer for this side of the
          cross-connection. Specified as a list of SubUnit elements describing
          the physical path from building level down to the port (e.g., Floor,
          Room/Hall, Rack/Cabinet, Patch Panel, Port). The Buyer MAY set
          subUnitNumber to 'NEXT_AVAILABLE' with subUnitType set to e.g. 'PORT'
          to request the Seller to assign the next available port at the
          specified location. When 'NEXT_AVAILABLE' is used, the Seller
          populates the sellerDemarcationPoint with the actual assigned port.
        type: array
        items:
          $ref: '../../../common/common.yaml#/definitions/SubUnit'
      sellerDemarcationPoint:
        description: >-
          The demarcation point assigned by the Seller. This is populated in
          the response when the Buyer requested 'NEXT_AVAILABLE', or when the
          Seller assigns a specific termination point that differs from the
          Buyer's request.
        type: array
        items:
          $ref: '../../../common/common.yaml#/definitions/SubUnit'
      physicalInterface:
        description: >-
          Describes the physical interface characteristics at the demarcation
          point for this side of the cross-connection. Specifies the media type
          and connector type. For a Type-0 Cross-Connection, the media type
          MUST be the same on both A-Side and Z-Side.
        $ref: '#/definitions/L0XcPhysicalInterface'
      loa:
        description: >-
          Letter of Authorization (LOA). Required when the Buyer does not own
          the facility on this side of the cross-connection and needs to
          authorize the Seller (cross-connect provider) to perform work at that
          location. The LOA MUST be provided as a PDF attachment.
        $ref: '../../../common/common.yaml#/definitions/AttachmentValue'
    required:
      - buildingId
      - physicalInterface
  L0XcConnectorType:
    description: >-
      Enumeration representing the physical connector type for a Layer 0
      Cross-Connection interface.
    type: string
    enum:
      - 'FC'
      - 'LC'
      - 'SC'
      - 'E2000'
      - 'OTHER'
  L0XcMediaType:
    description: >-
      Enumeration of Layer 0 media types representing the optical fiber
      classification used for the cross-connection.
    enum:
      - 'SINGLE_MODE_FIBER'
      - 'MULTI_MODE_50_MICRON'
      - 'MULTI_MODE_62.5_MICRON'
    type: string
  L0XcPhysicalInterface:
    description: >-
      Describes the physical interface characteristics of one side of the
      Cross-Connection. Specifies the media type (fiber type) and the connector
      type used at the demarcation point.
    properties:
      mediaType:
        description: >-
          The type of fiber media used for this side of the cross-connection.
          Must be consistent across both sides of a Type-0 Cross-Connection.
        $ref: '#/definitions/L0XcMediaType'
      connectorType:
        description: >-
          The type of physical connector used at this side of the
          cross-connection interface.
        $ref: '#/definitions/L0XcConnectorType'
    type: object
    required:
      - mediaType
      - connectorType
