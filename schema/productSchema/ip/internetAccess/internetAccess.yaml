description: |
  Internet Access is a Subscriber IP service, which means it is provided to an
  end-user (the Subscriber) by a Service Provider. A Subscriber can be an
  enterprise, a mobile operator, an IT system integrator, a government
  department, etc. Internet Access provides the Subscriber with connectivity to
  the global Internet. In this case, the Service Provider is acting as an
  Internet Service Provider.


  There are 4 Variants defined for Internet Access Products:


  ### Mplify Broadband Internet Access, Basic


  This Product is the simplest type of Internet Access Product and is commonly
  used for Residential Internet Access. Internet Access is provided via a
  Broadband Network, which can be, for example, DOCSIS, PON, Satellite, or
  Cellular. The Product includes the Internet Access Device necessary for the
  type of Broadband Network. Most basic Internet Access Products provide
  options for bandwidth, but some also provide additional options such as fixed
  IP addresses, cellular backup, various security options, etc.


  ### Mplify Broadband Internet Access, Advanced


  This Product is similar to the Basic Internet Access Product. It is delivered
  over a Broadband Network and includes the Internet Access Device, but it is
  often more business-focused and designed for small businesses with a single
  location or a small number of locations with relatively modest technical
  requirements. It usually provides some options not available in Basic
  Internet Access, such as multiple Public IP Addresses, and better Service
  Level Agreements, better availability, etc.


  ### Mplify Dedicated Internet Access, no Router


  This Product is a Dedicated Internet Access Product usually delivered on a
  wavelength (or part of a wavelength) on a fiber optic interface although it
  could be delivered over other media such as microwave, satellite, etc. It is
  designed for larger organizations that have substantial technical
  requirements for their Internet Access including (for example) substantial
  flexibility in deployment of IP addresses, advertising routes, dual homing,
  redundancy, etc. For this product, the Buyer provides the router.


  ### Mplify Dedicated Internet Access, with Router


  This Product is the same as the “Dedicated Internet Access, no Router” but
  the Seller is providing the router. The router can be physical or virtual.
  Therefore, the required and optional Product Attributes are the same as the
  previous Variant with the addition of Product Attributes related to the
  router and features that can be enabled on the router.
properties:
  variant:
    description: The name of the Internet Access Product Variant.
    $ref: '#/definitions/InternetAccessVariantName'
  demarcationPoint:
    description:
      The demarcation point is between the responsibility of the Buyer and the
      responsibility of the Seller upon delivery of the Product. Applicable
      ONLY to Broadband Internet Access, Basic and Advanced. [EditorNote] To be
      changed once Product Order and Product Inventory APIs will support it
      natively
    type: array
    items:
      $ref: '../../../common/common.yaml#/definitions/SubUnit'
  deliveryMechanism:
    description:
      Describes the type of equipment provided by the Seller as part of the
      Internet Access Product.
    $ref: '#/definitions/InternetAccessDeliveryMechanism'
  serviceAccessInterfaceType:
    description:
      For Broadband Internet Access (Basic and Advanced), the Service Access
      Interface is included as part of the Internet Access Product. (Note that
      this does not result in a separate Service Access Interface product.)
      This Product Attribute is used to describe the important characteristics
      of the Service Access Interface.
    $ref: '#/definitions/InternetAccessServiceAccessInterfaceType'
  vlan:
    description: >-
      The C-tag VLAN ID that the Internet Access is carried over at the access
      interface. It is an integer with a value between 1 and 4094. The value 0
      indicates that the Service uses untagged Ethernet frames. Applicable Use
      Cases: Dedicated Internet Access, with and without router
    $ref: '../../../common/ip/ipCommon.yaml#/definitions/VlanIdOrUntagged'
  features:
    description: >-
      Indicates the major functional and protocol features provided for the
      Internet Access Service. For Basic Broadband Internet Access this
      attribute must be empty
    $ref: '#/definitions/InternetAccessFeatures'
  bandwidth:
    description: >-
      For Broadband Internet Access this Product Attribute represents the
      "nominal" bandwidth. For Dedicated Internet Access this Product Attribute
      represents the maximum bandwidth that can be sustained by the Subscriber.
    $ref: '../../../common/common.yaml#/definitions/BiDirSimpleBandwidth'
  guaranteedBandwidth:
    description: >-
      The value of this Product Attribute is the bandwidth level that can be
      sustained by the Subscriber on a continual basis with a very high
      probability of successful packet delivery. This Product Attribute is
      commonly used for Dedicated Internet Access and rarely for Broadband
      Internet Access.
    $ref: '../../../common/common.yaml#/definitions/BiDirSimpleBandwidth'
  billingModel:
    description:
      The value of this Product Attribute indicates how the service is billed.
      Although the charge for the Product depends on the values of many Product
      Attributes, the billing model is based primarily on the bandwidth-related
      Product Attributes described in sections 11.12 and 11.13. Three models
      are defined.
    $ref: '#/definitions/InternetAccessBillingModel'
  localNetworkAddresses:
    description: >-
      The Internet Access Local Network Addresses Product Attribute is used
      when the Seller is responsible for assigning Private Local Network
      Addresses for the Buyer's Network. The value of the Product Attribute
      specifies the private address block to be assigned to the Buyer's IP
      hosts, whether DHCP is used, and if so, parameters necessary to configure
      the DHCP and NAT servers. Applicable Variants: Broadband Internet Access,
      Advanced Dedicated Internet Access, with router
    $ref: '#/definitions/InternetAccessLocalNetworkAddresses'
  providerIndependentIpAddresses:
    description: >-
      Indicates whether the Buyer is using Public (WAN) IP addresses routable
      over the Internet purchased directly from a registration authority for
      Internet Access or Public IP addresses obtained from the Seller.
      Applicable Variants: Broadband Internet Access, Advanced, Dedicated
      Internet Access with and without router.
    $ref: '../../../common/common.yaml#/definitions/EnabledDisabled'
  autonomousSystemNumber:
    description: >-
      An autonomous system (AS) is a collection of connected Internet Protocol
      (IP) routing prefixes under the control of one or more network operators
      on behalf of a single administrative entity or domain, that presents a
      common and clearly defined routing policy to the Internet. If the
      Subscriber is providing the Internet-routable IP Addresses  then this
      Product Attribute is required to be specified. Applicable Variants:
      Broadband Internet Access, Advanced, Dedicated Internet Access with and
      without router.
    $ref: '#/definitions/InternetAccessAutonomousSystemNumber'
  ipAddressType:
    description: >-
      Indicates whether the publicly routable IP address block consists of
      fixed addresses or addresses that can change over time. Applicable Use
      Cases: Broadband Internet Access, Advanced, Dedicated Internet Access
      with and without router.
    $ref: '#/definitions/InternetAccessIpAddressType'
  publicAddressesPrefixLength:
    description: >-
      If the Seller is providing the Public Addresses for the Internet Access
      Product (i.e., the value of the Internet Access Provider Independent IP
      Addresses Product Attribute is Disabled) then the value of this Product
      Attribute specifies the size of the IPv4 address block and the IPv6
      address block requested by the Buyer and provided by the Seller. The
      value of this Product Attribute has two parameters, a string that
      indicates the length (in bits) of the network mask for the IPv4 address
      block and a string that indicates the length of the network mask for the
      IPv6 address block. By extension, these strings indicate the length of
      the host mask for each address block. Applicable Variants: Broadband
      Internet Access, Advanced, Dedicated Internet Access with and without
      router.
    $ref: '#/definitions/InternetAccessPublicAddressesPrefixLength'
  publicAddressBlock:
    description: >-
      If the Subscriber is providing the WAN (public) addresses for the
      Internet Service (i.e., the value of the Internet Access Provider
      Independent IP Addresses Product Attribute is ENABLED) then this Product
      Attribute fully specifies the blocks (IPv4 or IPv6) of public addresses
      used by the Subscriber, e.g., "72.23.28.248/29". Applicable Variants:
      Broadband Internet Access, Advanced, Dedicated Internet Access with and
      without router.
    $ref: '#/definitions/InternetAccessPublicAddressBlock'
  transitAddresses:
    description: >-
      Internet Access Transit Addresses Prefix Length Product Attribute
      specifies the size of the IPv4 address block and the IPv6 address block
      used for Transit Addresses in the Seller's network to access the Buyer's
      Public Addresses. The value of this Product Attribute al-lows the Buyer
      to specify the number of Transit Addresses (IPv4 and IPv6) that it wants
      the Seller to allocate and the Seller to return the Transit Address
      blocks allocated by the Seller to the Buyer. Applicable Variants:
      Dedicated Internet Access, with and without router
    $ref: '#/definitions/InternetAccessTransitAddresses'
required:
  - variant
  - bandwidth
  - deliveryMechanism
  - features
definitions:
  AsnType:
    description: The type of the ASN.
    type: string
    enum:
      - PUBLIC
      - PRIVATE
  InternetAccessAutonomousSystemNumber:
    description:
      An autonomous system (AS) is a collection of connected Internet Protocol
      (IP) routing prefixes under the control of one or more network operators
      on behalf of a single administrative entity or domain, that presents a
      common and clearly defined routing policy to the Internet. If the
      Subscriber is providing the Internet-routable IP Addresses then this
      Product Attribute is required to be specified.
    properties:
      asnType:
        description: >-
          The type of the ASN. This MUST be provided If the value of the
          `providerIndependentIpAddress` is Enabled
        $ref: '#/definitions/AsnType'
      asnId:
        description:
          ASN Id. This MUST be provided if the value of the asnType is `PUBLIC`
        $ref: '../../../common/common.yaml#/definitions/FourOctetInteger'
    required:
      - asnType
  InternetAccessBgp:
    description: >-
      When an entry in the UNI Routing Protocol is for BGP, BGP as specified in
      RFC 4271 is used across the UNI to exchange information. Reference - MEF
      61.1 Section 12.7.3.
    type: object
    properties:
      subscriberAsNumber:
        description: BGP Subscriber Autonomous System number.
        $ref: '../../../common/common.yaml#/definitions/FourOctetInteger'
      connectionAddressFamily:
        description: Connection Address Family (IPv4 or IPv6).
        $ref: '../../../common/ip/ipRoutingProtocolsCommon.yaml#/definitions/AddressFamilyIpv4Ipv6'
      peeringAddresses:
        description: Peering Addresses.
        $ref: '../../../common/ip/ipCommon.yaml#/definitions/PeeringAddress'
      authentication:
        description: >-
          BGP Authentication. It is either empty list or if present is it a
          value of MD5 Password. It is assumed that an encrypted channel is
          used when this data is passed across the API so that the password is
          protected.
        type: array
        maxItems: 1
        items:
          type: string
      bgpCommunityList:
        description: >-
          Used to control which routers are accepted, preferred, distributed,
          or advertised.
        type: array
        items:
          $ref: '../../../common/ip/ipRoutingProtocolsCommon.yaml#/definitions/BgpCommunity'
      bgpExtendedCommunityList:
        description: >-
          Mechanism for labeling information carried in BGP-4. Provide
          enhancement over existing BGP Community Attribute an extended range,
          the addition of type field.
        type: array
        items:
          $ref: '../../../common/ip/ipRoutingProtocolsCommon.yaml#/definitions/BgpExtendedCommunity'
      holdTime:
        description: >-
          Hold time in seconds. Indicates the agreed Hold Time used for BGP
          sessions. The possible values are 0 or an integer in the range
          3-65535.
        $ref: '../../../common/ip/ipRoutingProtocolsCommon.yaml#/definitions/TwoOctetInteger'
      asOverride:
        description: >-
          Autonomous System Override. The SP (or Operator) can overwrite
          instances of the Subscriber's AS Number in the AS Path with their own
          AS Number, when advertising routes to the Subscriber. This needs to
          be explicitly agreed between the SP and the Subscriber, and/or
          between an SP/SO and an Operator.
        $ref: '../../../common/common.yaml#/definitions/EnabledDisabled'
    required:
      - subscriberAsNumber
      - connectionAddressFamily
      - peeringAddresses
      - authentication
  InternetAccessBillingModel:
    type: object
    properties:
      billingModelType:
        $ref: '#/definitions/InternetAccessBillingModelType'
      billingModelPlanName:
        type: string
        description:
          Specifies which Billing Plan Name the Buyer chooses to be used.
    required:
      - billingModelType
      - billingModelPlanName
  InternetAccessBillingModelType:
    enum:
      - FLAT
      - BURSTABLE_PERCENTILE
      - DATA_TRANSFER
    type: string
  InternetAccessDeliveryMechanism:
    description: |
      Describes the type of equipment provided by the Seller as part of the
      Internet Access Product.

      | Delivery Mechanism    | Description                                                                                                                                                                                                                                                                                                                             |
      | --------------------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
      | DEMARCATION_ONLY      | The product is delivered to the customer without IP routing. It is the buyer's responsibility to provide the mandatory routing function.                                                                                                                                                                                                |
      | PHYSICAL_ROUTER       | The product delivered to the buyer includes a physical IP Router installed at the customer premises.                                                                                                                                                                                                                                    |
      | VIRTUAL_ROUTER_REMOTE | The product delivered to the buyer includes an IP routing function which is executed in a virtual environment not at the customer premises. The network connectivity from the buyer's location to the virtual router provides transport only.                                                                                           |
      | VIRTUAL_ROUTER_LOCAL  | The product delivered to the buyer includes an IP routing function running in a virtual environment at the buyer's premises. The virtual environment (frequently referred to as a universal CPE, white-box CPE, or edge device) is provided by the Seller and can be pre-existing or can be delivered with the Internet Access Product. |
    enum:
      - DEMARCATION_ONLY
      - PHYSICAL_ROUTER
      - VIRTUAL_ROUTER_REMOTE
      - VIRTUAL_ROUTER_LOCAL
    type: string
  InternetAccessDhcpStaticListEntry:
    description: Entry of static DHCP MAC to IP mapping.
    type: object
    properties:
      staticMACAddress:
        description: >-
          MAC address
        type: string
      staticIpAddress:
        description: >-
          IPv4 or IPv6 Address
        $ref: '../../../common/ip/ipCommon.yaml#/definitions/Ipv4OrIpv6Address'
  InternetAccessFeature:
    description: >-
      Basic feature configuration for Internet Access
    properties:
      isSupported:
        description:
          Indicates whether support of the feature by the Seller is required.
        type: boolean
      isEnabled:
        description:
          Indicates whether Buyer requests that the Feature is enabled.
        type: boolean
    required:
      - isSupported
      - isEnabled
  InternetAccessFeatureAssistance:
    description:
      The level of Installation, Operation, and Configuration Changes done by
      Seller.
    allOf:
      - $ref: '#/definitions/InternetAccessFeature'
      - type: object
        properties:
          assistanceLevel:
            $ref: '#/definitions/InternetAccessAssistanceLevel'
            description: Assistance Level
          simpleRequestsPerMonth:
            description:
              The number of simple requests allowed per month. Applicable for
              Quote, Order and Inventory.
            type: integer
          complexRequestsPerMonth:
            description:
              The number of complex requests allowed per month. Applicable for
              Quote, Order and Inventory.
            type: integer
        required:
          - assistanceLevel
  InternetAccessAssistanceLevel:
    description: Assistance Level
    enum:
      - SELF_MANAGED
      - CO_MANAGED
      - FULLY_MANAGED
    type: string
  InternetAccessFeatureCloudPrioritization:
    description:
      The Seller enables prioritization, traffic congestion control, and SLAs
      for cloud traffic.
    allOf:
      - $ref: '#/definitions/InternetAccessFeature'
      - type: object
        properties:
          cloudServiceProvider:
            description: List of Cloud Service Providers
            type: array
            items:
              type: string
        required:
          - cloudServiceProvider
  InternetAccessFeatureDedicatedFirewall:
    description: The Seller provides a firewall service.
    allOf:
      - $ref: '#/definitions/InternetAccessFeature'
      - type: object
        properties:
          firewallCapability:
            $ref: '#/definitions/InternetAccessFirewallCapability'
            description:
              The value BASIC denotes a simple Firewall based on IP 5-tuples
              and/or Access Control Lists. The value ADVANCED denotes more
              sophisticated Firewall capabilities such as Deep Packet
              Inspection.
        required:
          - firewallCapability
  InternetAccessFirewallCapability:
    description:
      The value BASIC denotes a simple Firewall based on IP 5-tuples and/or
      Access Control Lists. The value ADVANCED denotes more sophisticated
      Firewall capabilities such as Deep Packet Inspection.
    enum:
      - BASIC
      - ADVANCED
    type: string
  InternetAccessFeatureDns:
    description:
      The seller is providing a Domain Name Service to translate Domain Names
      to IP addresses.
    allOf:
      - $ref: '#/definitions/InternetAccessFeature'
      - type: object
        properties:
          searchDomain:
            description: >-
              A possibly empty ordered list of domain names, specified as
              strings, that are sequentially appended to the specified domain
              name if the specified domain name does not include a dot (.),
              until the first successful DNS lookup. Applicable to Order and
              Inventory
            type: array
            items:
              type: string
  InternetAccessFeatureFacilityDiversity:
    description:
      The Seller ensures that this Internet Access Service has no common points
      of failure with another Internet Access Service.
    allOf:
      - $ref: '#/definitions/InternetAccessFeature'
      - type: object
        properties:
          internetAccessRef:
            description: >-
              Identifier for the other Internet Access Service. Applicable to
              Order and Inventory
            type: string
  InternetAccessFeatureLayer3Resiliency:
    description:
      The Seller providers Layer 3 resiliency for the access connection to the
      Buyer. If the `layer3Resiliency` feature with `WIRELESS_BACKUP` is
      specified, the `mobileBackup` feature MUST also be specified.
    allOf:
      - $ref: '#/definitions/InternetAccessFeature'
      - type: object
        properties:
          layer3Resiliency:
            description: >-
              Translation and forwarding rules
            $ref: '#/definitions/InternetAccessLayer3Resiliency'
        required:
          - layer3Resiliency
  InternetAccessLayer3Resiliency:
    description: Translation and forwarding rules
    enum:
      - DUAL_ACCESS_ALL_ACTIVE
      - DUAL_ACCESS_ACTIVE_STANDBY
      - WIRELESS_BACKUP
    type: string
  InternetAccessFeatureMobileBackup:
    description:
      The Seller provides a method for backing up the Internet Access Service
      via a 4G or 5G cellular service.
    allOf:
      - $ref: '#/definitions/InternetAccessFeature'
      - type: object
        properties:
          minimumExpectedBandwidth:
            description: >-
              Bandwidth of the mobile backup.
            $ref: '../../../common/common.yaml#/definitions/BiDirSimpleBandwidth'
        required:
          - minimumExpectedBandwidth
  InternetAccessFeatureMonitoring:
    description:
      The Seller is monitoring the Internet Access Service for the Buyer.
    allOf:
      - $ref: '#/definitions/InternetAccessFeature'
      - type: object
        properties:
          monitoringType:
            description: >-
              Monitoring type
            $ref: '#/definitions/InternetAccessMonitoringType'
        required:
          - monitoringType
  InternetAccessMonitoringType:
    description: Monitoring type
    enum:
      - PROACTIVE
      - REACTIVE
    type: string
  InternetAccessFeatureRouting:
    description:
      The method by which IP routes are exchanged between the Buyer and the
      Seller.
    allOf:
      - $ref: '#/definitions/InternetAccessFeature'
      - type: object
        minproperties: 1
        maxproperties: 2
        properties:
          routingType:
            description: >-
              Routing type designation. BGP or Static
            $ref: '#/definitions/InternetAccessRoutingType'
          bgp:
            description: >-
              BGP routing configuration for Internet Access in case BGP is used
              as the routing type.
            $ref: '#/definitions/InternetAccessBgp'
          static:
            description: >-
              Static routing configuration for Internet Access in case STATIC
              is used as the routing type.
            $ref: '../../../common/ip/ipRoutingProtocolsCommon.yaml#/definitions/Static'
        required:
          - routingType
  InternetAccessRoutingType:
    description: Routing type designation. BGP or Static
    enum:
      - BGP
      - STATIC
    type: string
  InternetAccessFeatures:
    description: >-
      List of all possible feature configurations for Internet Access. If a
      value for a feature is not specified, it is equivalent to specifying the
      feature with isSupported=false and isEnabled=false.
    type: object
    properties:
      assistance:
        description: >-
          The level of Installation, Operation, and Configuration Changes done
          by Seller.
        $ref: '#/definitions/InternetAccessFeatureAssistance'
      cloudPrioritization:
        description: >-
          The Seller enables prioritization, traffic congestion control, and
          SLAs for cloud traffic.
        $ref: '#/definitions/InternetAccessFeatureCloudPrioritization'
      ddosMitigation:
        description: >-
          The Seller provides enhanced protection of the customer network from
          Distributed Denial of Service (DDoS) attacks.
        $ref: '#/definitions/InternetAccessFeature'
      dedicatedFirewall:
        description: >-
          The Seller provides a firewall service implemented on a dedicated
          device.
        $ref: '#/definitions/InternetAccessFeatureDedicatedFirewall'
      dns:
        description: >-
          The seller is providing a Domain Name Service to translate Domain
          Names to IP addresses.
        $ref: '#/definitions/InternetAccessFeatureDns'
      facilityDiversity:
        description: >-
          The Seller ensures that this Internet Access Service has no common
          points of failure with another Internet Access Service.
        $ref: '#/definitions/InternetAccessFeature'
      layer3Resiliency:
        description: >-
          The Seller providers Layer 3 resiliency for the access connection to
          the Buyer. If the LAYER 3 RESILIENCY feature with Wireless Backup is
          specified, the MOBILE BACKUP feature MUST also be specified.
        $ref: '#/definitions/InternetAccessFeatureLayer3Resiliency'
      mobileBackup:
        description: >-
          The Seller provides a method for backing up the Internet Access
          Service via a 4G or 5G cellular service.
        $ref: '#/definitions/InternetAccessFeatureMobileBackup'
      monitoring:
        description: >-
          The Seller is monitoring the Internet Access Service for the Buyer.
        $ref: '#/definitions/InternetAccessFeatureMonitoring'
      performanceReporting:
        description: >-
          Performance Metrics are delivered to the Buyer on the Internet Access
          Service.
        $ref: '#/definitions/InternetAccessFeature'
      routing:
        description: >-
          The method by which IP routes are exchanged between the Buyer and the
          Seller.
        $ref: '#/definitions/InternetAccessFeatureRouting'
      snmpRead:
        description: >-
          The Seller providers SNMP v2/v3 read access to the router including
          MIB-2.
        $ref: '#/definitions/InternetAccessFeature'
  InternetAccessIpAddressType:
    description:
      Indicates whether the publicly routable IP address block consists of
      fixed addresses or addresses that can change over time.
    type: string
    enum:
      - STATIC
      - DYNAMIC
  InternetAccessIpv4PublicAddressesPrefixLength:
    description:
      Indicates the length (in bits) of the network mask for the IPv4 address
      block, and by extension, the length of the host mask. The size of the
      host mask defines the number of IP addresses available for use in the
      Subscriber's network. The value "NONE" indicates that no IPv4 addresses
      are distributed by DHCP to the Subscriber network.
    enum:
      - /24
      - /25
      - /26
      - /27
      - /28
      - /29
      - /30
      - /31
      - /32
      - NONE
    type: string
  InternetAccessIpv4TransitAddressPrefixLength:
    description: IPv4 Transit Address Prefix Length
    enum:
      - /24
      - /25
      - /26
      - /27
      - /28
      - /29
      - /30
      - /31
      - /32
      - NONE
    type: string
  InternetAccessIpv6PublicAddressesPrefixLength:
    description:
      The length (in bits) of the network mask for the IPv6 address block, and
      by extension, the length of the host mask. The value "NONE" indicates
      that no IPv6 addresses are distributed by DHCP to the Subscriber network.
    enum:
      - /96
      - /100
      - /104
      - /108
      - /112
      - /116
      - /120
      - /124
      - /128
      - NONE
    type: string
  InternetAccessIpv6TransitAddressPrefixLength:
    description: IPv6 Transit Address Prefix Length
    enum:
      - /120
      - /124
      - /128
      - NONE
    type: string
  InternetAccessLocalNetworkAddresses:
    description:
      The Local Network Addresses attribute is used when the Seller is
      responsible for assigning Private Local Network Addresses for the Buyer's
      Network (see Mplify 164 [18] section 11.3). The value of Product
      Attribute specifies the private address block to be assigned to the
      Buyer's IP hosts, whether DHCP and NAT are used, and if so, parameters
      necessary to configure the DHCP and NAT servers.
    properties:
      lanAddressBlock:
        type: string
        description: 'IP address range, specified in CIDR notation.'
        example: '192.0.2.0/24'
      dhcpStatus:
        description: >-
          Indicates whether the Buyer wants the Seller to provide a DHCP
          Service.
        $ref: '../../../common/common.yaml#/definitions/EnabledDisabled'
      dhcpStart:
        description: >-
          Start of the DHCP address range. This is the first address in the
          range that can be assigned to a device. IPv4 or IPv6 address.
        $ref: '../../../common/ip/ipCommon.yaml#/definitions/Ipv4OrIpv6Address'
      dhcpEnd:
        description: >-
          End of the DHCP address range. This is the last address in the range
          that can be assigned to a device. IPv4 or IPv6 address.
        $ref: '../../../common/ip/ipCommon.yaml#/definitions/Ipv4OrIpv6Address'
      dhcpStaticList:
        description: >-
          A list of static IP addresses that are reserved for specific devices
          in the network. Each entry in the list is a string representing an
          IPv4 or IPv6 address.
        type: array
        items:
          $ref: '#/definitions/InternetAccessDhcpStaticListEntry'
      natStatus:
        description: >-
          Indicates whether the Buyer wants the Seller to provide a NAT Service
        $ref: '../../../common/common.yaml#/definitions/EnabledDisabled'
      natAddress:
        description: >-
          An IP address if `natStatus` is Enabled. This is the single IP
          Address
        $ref: '../../../common/ip/ipCommon.yaml#/definitions/Ipv4OrIpv6Address'
    required:
      - dhcpStatus
      - natStatus
    type: object
  InternetAccessPhysicalInterface:
    description:
      Describes the physical aspects of the Service Access Interface delivered
      by the Seller
    properties:
      physicalLayer:
        description: >-
          Specifies a physical layer
        $ref: '#/definitions/SaiEthernetPhysicalLayer'
      connectorType:
        description: >-
          Indicates the connector type,
        $ref: '../../../common/common.yaml#/definitions/ConnectorType'
    type: object
    required:
      - physicalLayer
      - connectorType
  InternetAccessRecurringPrice:
    type: object
    required: [priceDescription, price, recurringChargePeriod]
    properties:
      priceDescription:
        type: string
      price:
        $ref: '../../../common/common.yaml#/definitions/Price'
      recurringChargePeriod:
        description: Used for a recurring charge to indicate a period
        $ref: '../../../common/common.yaml#/definitions/Duration'
  InternetAccessResiliency:
    description: |
      Describes the configuration for resiliency at the Service Access
      Interface

      | Resiliency type       | Description                                                                                                                  |
      | --------------------- | ---------------------------------------------------------------------------------------------------------------------------- |
      | NONE                  | No resiliency                                                                                                                |
      | ALL_ACTIVE            | Link Aggregation is used, and all of the physical interfaces specified in can be active and carrying traffic simultaneously. |
      | 2_LINK_ACTIVE_STANDBY | Link Aggregation is used and that there are two physical interfaces and only one of them can be carrying traffic.            |
      | OTHER                 | The buyer and seller have agreed on a resiliency approach other than Link Aggregation.                                       |
    enum:
      - NONE
      - ALL_ACTIVE
      - 2_LINK_ACTIVE_STANDBY
      - OTHER
    type: string
  InternetAccessServiceAccessInterfaceType:
    description:
      Describes the aspects of the Service Access Interface delivered by the
      Seller
    properties:
      physicalInterface:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/InternetAccessPhysicalInterface'
        description: >-
          Describes the physical aspects of the Service Access Interface
          delivered by the Seller
      resiliency:
        description: >-
          Describes the configuration for resiliency at the Service Access
          Interface
        $ref: '#/definitions/InternetAccessResiliency'
    type: object
    required:
      - physicalInterface
      - resiliency
  InternetAccessPublicAddressesPrefixLength:
    description:
      If the Seller is providing the Public Addresses for the Internet Access
      Product (i.e., the value of the Internet Access Provider Independent IP
      Addresses Product Attribute is Disabled) then the value of this Product
      Attribute specifies the size of the IPv4 address block and the IPv6
      address block requested by the Buyer and provided by the Seller. The
      value of this Product Attribute has two parameters, a string that
      indicates the length (in bits) of the network mask for the IPv4 address
      block and a string that indicates the length of the network mask for the
      IPv6 address block. By extension, these strings indicate the length of
      the host mask for each address block
    properties:
      ipv4:
        description: >-
          IPv4 Public Addresses Prefix Length
        $ref: '#/definitions/InternetAccessIpv4PublicAddressesPrefixLength'
      ipv6:
        description: >-
          IPv6 Public Addresses Prefix Length
        $ref: '#/definitions/InternetAccessIpv6PublicAddressesPrefixLength'
    required:
      - ipv4
      - ipv6
    type: object
  InternetAccessPublicAddressBlock:
    description:
      If the Subscriber is providing the WAN (public) addresses for the
      Internet Service (i.e., the value of the Internet Access Provider
      Independent IP Addresses Product Attribute is ENABLED) then this Product
      Attribute fully specifies the blocks (IPv4 or IPv6) of public addresses
      used by the Subscriber, e.g., "72.23.28.248/29".
    properties:
      ipv4:
        description: >-
          IPv4 Address Block in CIDR notation or `NONE`
        type: string
      ipv6:
        description: >-
          IPv6 Address Block in CIDR notation or `NONE`
        type: string
    required:
      - ipv4
      - ipv6
    type: object
  InternetAccessTransitAddresses:
    description: >-
      Internet Access Transit Addresses Prefix Length Product Attribute
      specifies the size of the IPv4 address block and the IPv6 address block
      used for Transit Addresses in the Seller's network to access the Buyer's
      Public Addresses. The value of this Product Attribute al-lows the Buyer
      to specify the number of Transit Addresses (IPv4 and IPv6) that it wants
      the Seller to allocate and the Seller to return the Transit Address
      blocks allocated by the Seller to the Buyer. Applicable Variants:
      Dedicated Internet Access, with and without router
    properties:
      requestedIpv4TransitAddressPrefixLength:
        description: >-
          IPv4 Transit Address Prefix Length
        $ref: '#/definitions/InternetAccessIpv4TransitAddressPrefixLength'
      requestedIpv6TransitAddressPrefixLength:
        description: >-
          IPv6 Transit Address Prefix Length
        $ref: '#/definitions/InternetAccessIpv6TransitAddressPrefixLength'
      serviceProviderIpv4TransitAddress:
        type: string
        description: 'IPv4 address, specified in CIDR notation or `NONE`'
      serviceProviderIpv6TransitAddress:
        type: string
        description: 'IPv6 address, specified in CIDR notation or `NONE`'
  InternetAccessVariantName:
    description:
      Allowed Internet Access product variants. This is used to explicitly
      state the intent f the Buyer so that the Seller knows which validation
      logic to apply
    type: string
    enum:
      - BROADBAND_BASIC
      - BROADBAND_ADVANCED
      - DEDICATED_WITHOUT_ROUTER
      - DEDICATED_WITH_ROUTER
