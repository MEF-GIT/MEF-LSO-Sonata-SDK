components:
  schemas:
    Error:
      description: |
        Standard Class used to describe API response error
        Not intended to be use directly. The `code` in the HTTP header is used as a discriminator for the type of error returned in runtime.
      properties:
        reason:
          description: Text that explains the reason for error. This can be shown
            to a client user.
          maxLength: 255
          type: string
        message:
          description: Text that provide mode details and corrective actions related
            to the error. This can be shown to a client user.
          type: string
        referenceError:
          description: url pointing to documentation describing the error
          format: uri
          type: string
      required:
      - reason
      type: object
    Error400:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error400Code'
        required:
        - code
        type: object
      description: Bad Request. (https://tools.ietf.org/html/rfc7231#section-6.5.1)
    Error400Code:
      description: |-
        One of the following error codes:
        - missingQueryParameter: The URI is missing a required query-string parameter
        - missingQueryValue: The URI is missing a required query-string parameter value
        - invalidQuery: The query section of the URI is invalid.
        - invalidBody: The request has an invalid body
      enum:
      - missingQueryParameter
      - missingQueryValue
      - invalidQuery
      - invalidBody
      type: string
    Error401:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error401Code'
        required:
        - code
        type: object
      description: Unauthorized.  (https://tools.ietf.org/html/rfc7235#section-3.1)
    Error401Code:
      description: |-
        One of the following error codes:
        - missingCredentials: No credentials provided.
        - invalidCredentials: Provided credentials are invalid or expired
      enum:
      - missingCredentials
      - invalidCredentials
      type: string
    Error403:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error403Code'
        required:
        - code
        type: object
      description: Forbidden. (https://tools.ietf.org/html/rfc7231#section-6.5.3)
    Error403Code:
      description: |-
        This code indicates that the server understood
        the request but refuses to authorize it because
        of one of the following error codes:
        - accessDenied: Access denied
        - forbiddenRequester: Forbidden requester
        - tooManyUsers: Too many users
      enum:
      - accessDenied
      - forbiddenRequester
      - tooManyUsers
      type: string
    Error500:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              One of the following error codes:
              - internalError: Internal server error - the server encountered an unexpected condition that prevented it from fulfilling the request.
            enum:
            - internalError
            type: string
        required:
        - code
        type: object
      description: Internal Server Error. (https://tools.ietf.org/html/rfc7231#section-6.6.1)
    Event:
      description: Event class is used to describe information structure used for
        notification.
      properties:
        eventId:
          description: Id of the event
          type: string
        eventTime:
          description: Date-time when the event occurred
          format: date-time
          type: string
        eventType:
          description: The type of the notification.
          type: string
        event:
          description: The event linked to the involved resource object
          type: object
      required:
      - event
      - eventId
      - eventTime
      - eventType
      type: object
    IncidentAttributeValueChangeEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - incidentAttributeValueChangeEvent
            type: string
          event:
            $ref: '#/components/schemas/IncidentEventPayload'
        required:
        - event
        - eventType
        type: object
    IncidentCreateEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - incidentCreateEvent
            type: string
          event:
            $ref: '#/components/schemas/IncidentEventPayload'
        required:
        - event
        - eventType
        type: object
    IncidentEventPayload:
      description: The identifier of the Incident being subject of this event.
      properties:
        id:
          description: ID of the Incident
          type: string
        href:
          description: Hyperlink to access the Incident
          type: string
      required:
      - id
      type: object
    IncidentStatusChangeEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - incidentStatusChangeEvent
            type: string
          event:
            $ref: '#/components/schemas/IncidentStatusChangeEventPayload'
        required:
        - event
        - eventType
        type: object
    IncidentStatusChangeEventPayload:
      description: The identifier of the Trouble Ticket being subject of this event.
      properties:
        id:
          description: ID of the Trouble Ticket
          type: string
        href:
          description: Hyperlink to access the Trouble Ticket
          type: string
        status:
          $ref: '#/components/schemas/IncidentStatusType'
      required:
      - id
      - status
      type: object
    IncidentStatusType:
      description: |
        Possible values for the status of the Incident

        | status       | MEF 113 name | Description                                                                                                                                                              |
        | ------------ | ------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
        | `closed`     | CLOSED       | The Situation described in the Incident was closed by has been resolved and normal operation has been restored on the Seller.Seller's network. This is a terminal state. |
        | `created`    | CREATED      | A new Incident has been created and allocated a unique `id`.                                                                                                             |
        | `inProgress` | IN_PROGRESS  | The Incident is in the process of being handled and investigated for resolution by the Seller.
      enum:
      - closed
      - created
      - inProgress
      type: string
    TroubleTicketAttributeValueChangeEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - troubleTicketAttributeValueChangeEvent
            type: string
          event:
            $ref: '#/components/schemas/TroubleTicketEventPayload'
        required:
        - event
        - eventType
        type: object
    TroubleTicketEventPayload:
      description: The identifier of the Trouble Ticket being subject of this event.
      properties:
        id:
          description: ID of the Trouble Ticket
          type: string
        href:
          description: Hyperlink to access the Trouble Ticket
          type: string
      required:
      - id
      type: object
    TroubleTicketInformationRequiredEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - troubleTicketInformationRequiredEvent
            type: string
          event:
            $ref: '#/components/schemas/TroubleTicketEventPayload'
        required:
