openapi: 3.0.1
info:
  description: "**This file forms part of MEF 141.1**\n\n**This draft represents MEF\
    \ work in progress and is subject to change.**\n\n**This API implements Business\
    \ Requirements described in MEF 134.**\n\nBill is a legal document generated by\
    \ the Seller to the Buyer relating \nto charges associated to Products provided\
    \ by the Seller to the Buyer. \n\nList of supported use cases:\n- Retrieve Invoice\
    \ List\n- Retrieve Invoice by Identifier \n- Retrieve Invoice Line Item by Identifier\n\
    - Retrieve Printable Invoice   \n- Register for Invoice Notification\n\nCopyright\
    \ 2025 MEF Forum and its contributors\n\nThis file includes content based on the\
    \ TM Forum Customer Bill Management\nAPI (TMF678 v4.0.0) available at https://github.com/tmforum-apis/TMF678_CustomerBill,\n\
    which is licensed by the TM Forum under the Apache License version 2.0.\nSuch\
    \ content has been modified by the MEF Forum and its contributors.\n"
  title: Billing Management
  version: 3.0.0-RC
servers:
- url: "https://{serverBase}/mefApi/sonata/customerBillManagement/v3/"
  variables:
    serverBase:
      default: mef.net
      description: The base of Seller's URL.
security:
- oauth2MEFLSOAPI:
  - default
tags:
- name: Customer Bill
- name: Events Subscription
paths:
  /customerBill:
    get:
      description: This operation lists or finds CustomerBill entities
      operationId: listCustomerBill
      parameters:
      - description: An identifier for the Billing Account that is unique within the
          Seller.
        in: query
        name: billingAccount.id
        required: false
        schema:
          type: string
      - description: The date the Billing Period started - lower than.
        in: query
        name: billingPeriod.startDateTime.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: The date the Billing Period started - greater than.
        in: query
        name: billingPeriod.startDateTime.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: The date the Billing Period ended - lower than.
        in: query
        name: billingPeriod.endDateTime.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: The date the Billing Period ended - greater than.
        in: query
        name: billingPeriod.endDateTime.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: "The category of Bill. One of the following:  - normal  - duplicate\
          \ - trial"
        in: query
        name: category
        required: false
        schema:
          enum:
          - normal
          - duplicate
          - trial
          type: string
      - description: The state of the Bill Item.
        in: query
        name: state
        required: false
        schema:
          enum:
          - generated
          - paymentDue
          - settled
          type: string
      - description: Requested index for start of resources to be provided in response.
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: Requested number of resources to be provided in response.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/CustomerBill_Find'
                type: array
          description: Success
          headers:
            X-Pagination-Throttled:
              description: |
                Used to indicate that result page was throttled to maximum possible size  and there are additional results that can be fetched
              schema:
                type: boolean
            X-Total-Count:
              description: |
                The total number of matching records. E.g. if there are 50 matching records in total, but the request has offset=10 and limit=10, then the X-Total-Count is 50.
              schema:
                type: integer
            X-Result-Count:
              description: The number of records included in the response
              schema:
                type: integer
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - listCustomerBill
      summary: List or find CustomerBill objects
      tags:
      - Customer Bill
  /customerBill/{id}:
    get:
      description: This operation retrieves a CustomerBill entity.
      operationId: retrieveCustomerBill
      parameters:
      - description: Identifier of the CustomerBill
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/CustomerBill'
                type: array
          description: OK. (https://tools.ietf.org/html/rfc7231#section-6.3.1)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - retrieveCustomerBill
      summary: Retrieves a CustomerBill by ID
      tags:
      - Customer Bill
  /customerBillItem/{id}:
    get:
      description: This operation retrieves a CustomerBillItem entity.
      operationId: retrieveCustomerBillItem
      parameters:
      - description: Identifier of the CustomerBillItem
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/CustomerBillItem'
                type: array
          description: OK. (https://tools.ietf.org/html/rfc7231#section-6.3.1)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - retrieveCustomerBillItem
      summary: Retrieves a CustomerBillItem by ID
      tags:
      - Customer Bill
  /hub:
    post:
      description: The Buyer requests to subscribe to Bill Notifications.
      operationId: registerListener
      parameters:
      - description: The unique identifier of the organization that is acting as the
          a Buyer. MUST be specified in the request only when the requester represents
          more than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          Seller. MUST be specified in the request only when responding entity represents
          more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/EventSubscriptionInput'
        description: Data containing the callback endpoint to deliver the information
        required: true
      responses:
        "201":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          description: Subscribed  (https://tools.ietf.org/html/rfc7231#section-6.3.2)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
        "501":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error501'
          description: Method not implemented.
      security:
      - oauth2MEFLSOAPI:
        - registerListener
      summary: Allows the Buyer to register to Bill state change notifications
      tags:
      - Events Subscription
  /hub/{id}:
    delete:
      description: The Buyer requests to unsubscribe from Bill Notifications
      operationId: unregisterListener
      parameters:
      - description: The id of the EventSubscription
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          a Buyer. MUST be specified in the request only when the requester represents
          more than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          Seller. MUST be specified in the request only when responding entity represents
          more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Deleted (https://tools.ietf.org/html/rfc7231#section-6.3.5)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
        "501":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error501'
          description: Method not implemented.
      security:
      - oauth2MEFLSOAPI:
        - unregisterListener
      summary: Unregister a listener
      tags:
      - Events Subscription
    get:
      description: This operation retrieves a hub entity.
      operationId: retrieveHub
      parameters:
      - description: Identifier of the Hub
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: "The unique identifier of the organization that is acting as\
          \ the a Buyer. MUST be specified in the request only when the requester\
          \ represents more than one Buyer. Reference: MEF 57.2 (Sn 9.18)"
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: "The unique identifier of the organization that is acting as\
          \ the Seller. MUST be specified in the request only when responding entity\
          \  represents more than one Seller. Reference: MEF 57.2 (Sn 9.18)"
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          description: Success
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
        "501":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error501'
          description: Method not implemented.
      security:
      - oauth2MEFLSOAPI:
        - retrieveHub
      summary: Retrieves a Hub by ID
      tags:
      - Events Subscription
components:
  schemas:
    AppliedPayment:
      description: A list of details of a payment that has been received from the
        Buyer.
      properties:
        appliedAmount:
          $ref: '#/components/schemas/Money'
        payment:
          $ref: '#/components/schemas/PaymentItem'
      type: object
    AttachmentURL:
      description: The URL pointing to an Attachment for download.
      properties:
        url:
          description: The URL pointing to an Attachment for download.
          type: string
      type: object
    BillingAccountRef:
      description: An identifier for the Billing Account that is unique within the
        Seller
      properties:
        id:
          description: Unique-Identifier
          type: string
      required:
      - id
      type: object
    CustomerBill:
      description: A legal document generated by the Seller to the Buyer relating
        to charges associated to Products provided by the Seller to the Buyer.
      properties:
        id:
          description: An identifier assigned to the Bill by the Seller.
          type: string
        href:
          description: Bill's unique reference.
          type: string
        amountDue:
          $ref: '#/components/schemas/Money'
        appliedPayment:
          description: A list of details of a payment that has been received from
            the Buyer.
          items:
            $ref: '#/components/schemas/AppliedPayment'
          type: array
        billingAccount:
          $ref: '#/components/schemas/BillingAccountRef'
        billCycle:
          description: The identifier of the Billing Cycle iteration.
          type: string
        billDate:
          description: Date the Bill was issued.
          format: date-time
          type: string
        billDocument:
          $ref: '#/components/schemas/AttachmentURL'
        billNo:
          description: A number assigned to the Bill by the Seller.
          type: string
        billingPeriod:
          $ref: '#/components/schemas/TimePeriod'
        category:
          $ref: '#/components/schemas/CustomerBillCategory'
        credits:
          $ref: '#/components/schemas/Money'
        customerBillItem:
          description: A reference to the Bill Items for this Bill.
          items:
            $ref: '#/components/schemas/CustomerBillItemRef'
          type: array
        discounts:
          $ref: '#/components/schemas/Money'
        fees:
          $ref: '#/components/schemas/Money'
        financialAccount:
          $ref: '#/components/schemas/FinancialAccountRef'
        lastUpdate:
          description: The date when the Bill was last modified.
          format: date-time
          type: string
        paymentDueDate:
          description: The date by which payment of the Amount Due must be received
            by the Seller.
          format: date-time
          type: string
        runType:
          $ref: '#/components/schemas/CustomerBillRunType'
        relatedContactInformation:
          description: A party related to this Bill.
          items:
            $ref: '#/components/schemas/RelatedContactInformation'
          type: array
        remainingAmount:
          $ref: '#/components/schemas/Money'
        state:
          $ref: '#/components/schemas/CustomerBillStateType'
        taxExcludedAmount:
          $ref: '#/components/schemas/Money'
        taxIncludedAmount:
          $ref: '#/components/schemas/Money'
        taxItem:
          description: A tax item is created for each tax rate and tax type used in
            the bill.
          items:
            $ref: '#/components/schemas/TaxItem'
          type: array
      required:
      - amountDue
      - appliedPayment
      - billCycle
      - billDate
      - billDocument
      - billNo
      - billingAccount
      - billingPeriod
      - category
      - credits
      - customerBillItem
      - discounts
      - fees
      - financialAccount
      - id
      - lastUpdate
      - paymentDueDate
      - relatedContactInformation
      - remainingAmount
      - runType
      - state
      - taxExcludedAmount
      - taxIncludedAmount
      - taxItem
      type: object
    CustomerBillCategory:
      description: "The type of Bill. \n\n| Value       | MEF 134   |Description \
        \                                                                        \
        \                                                                        \
        \                   |\n| ----------- | --------- |------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\
        \ |\n| `normal`    | NORMAL    |An Bill for the Billing Cycle            \
        \                                                                        \
        \                                                              |\n| `duplicate`\
        \ | DUPLICATE |A copy of an Bill that has been provided                  \
        \                                                                        \
        \                                             |\n| `trial`     | TRIAL   \
        \  |An Bill that is sent by the Seller to the Buyer for test Billing purposes\
        \ to assist in assuring that their Billing implementations are compatible.\
        \ The Trial Bill is not paid. |\n"
      enum:
      - normal
      - duplicate
      - trial
      type: string
    CustomerBillItem:
      description: One or more rows in a Bill that represent charges associated with
        a Product instance.
      properties:
        id:
          description: The CustomerBillItem identifier.
          type: string
        href:
          description: Reference of the CustomerBillItem.
          type: string
        appliedTax:
          description: Taxes associated with the Bill Item.
          items:
            $ref: '#/components/schemas/CustomerBillItemTax'
          type: array
        appliedFee:
          items:
            $ref: '#/components/schemas/CustomerBillItemFee'
          type: array
        customerBillItemType:
          $ref: '#/components/schemas/MEFPriceType'
        description:
          description: A text description of the charge.
          type: string
        periodCoverage:
          $ref: '#/components/schemas/TimePeriod'
        product:
          $ref: '#/components/schemas/ProductRef'
        productOrderItem:
          $ref: '#/components/schemas/MEFProductOrderItemRef'
        productName:
          description: The name of the Product that is the subject of the Bill Item.
          type: string
        state:
          $ref: '#/components/schemas/CustomerBillItemStateType'
        taxExcludedAmount:
          $ref: '#/components/schemas/Money'
        unit:
          description: The rate per unit for the Bill determined during or after the
            Billing Process.
          type: string
        unitRate:
          $ref: '#/components/schemas/Money'
        unitQuantity:
          description: The number of units.
          type: number
      required:
      - appliedFee
      - appliedTax
      - customerBillItemType
      - description
      - id
      - periodCoverage
      - product
      - productName
      - productOrderItem
      - state
      - taxExcludedAmount
      - unit
      - unitQuantity
      - unitRate
      type: object
    CustomerBillItemFee:
      description: Fees associated with the Bill Item.
      properties:
        category:
          $ref: '#/components/schemas/CustomerBillItemFeeCategory'
        description:
          description: A description of the type of Fee.
          type: string
        rate:
          description: The rate at which the Fee is calculated.
          format: float
          type: number
        amount:
          $ref: '#/components/schemas/Money'
      type: object
    CustomerBillItemFeeCategory:
      description: |
        The category of the Fee. One of the following:
        - recurring
        - nonRecurring
        - other
      enum:
      - recurring
      - nonRecurring
      - other
      type: string
    CustomerBillItemRef:
      description: |
        A reference to a Customer Bill resource.
      properties:
        href:
          description: |
            Hyperlink to the referenced Customer Bill.
          type: string
        id:
          description: Identifier of the referenced Customer Bill.
          type: string
      required:
      - id
      type: object
    CustomerBillItemStateType:
      description: |
        The state of the Bill Item.

        | state                      | MEF 134 name               | Description                                                                                                                                                                   |
        | -------------------------- | -------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
        | `credit`                   | CREDIT                     | The Seller has agreed with the Buyer that disputed charges are in error and has provided a credit for the amount in error.                                                    |
        | `disputeBeingInvestigated` | DISPUTE_BEING_INVESTIGATED | A Buyer has disputed charges included in a Bill and those charges are in the Sellers Dispute Process. Disputes cannot exit the dispute process until the Dispute is resolved. |
        | `generated`                | GENERATED                  | A Bill that has been created based on the completion of a Billing Cycle and a Bill Notification has been sent to the Buyer.                                                   |
        | `paymentDue`               | PAYMENT_DUE                | The Seller has completed their dispute process and they are expecting payment from the Buyer.                                                                                 |
        | `settled`                  | SETTLED                    | A Bill for which all payment due has been received or for which payment is due.                                                                                               |
        | `withdrawn`                | WITHDRAWN                  | A Seller has agreed with the Buyer that disputed charges are in error and has withdrawn the Bill.                                                                            |
      enum:
      - credit
      - disputeBeingInvestigated
      - generated
      - paymentDue
      - settled
      - withDrawn
      type: string
    CustomerBillItemTax:
      description: The applied billing tax rate represents the taxes applied billing
        rate it refers to. It is calculated during the billing process.
      properties:
        category:
          $ref: '#/components/schemas/CustomerBillItemTaxCategory'
        description:
          description: A description of the type of Tax.
          type: string
        rate:
          description: The rate at which the Tax is calculated.
          format: float
          type: number
        amount:
          $ref: '#/components/schemas/Money'
      type: object
    CustomerBillItemTaxCategory:
      description: |-
        The category of the Tax. One of the following:
          - country
          - state
          - county
          - city
          - other
      enum:
      - country
      - state
      - county
      - city
      - other
      type: string
    CustomerBillRunType:
      description: "The Billing cycle as set by the Seller.\n\n| Value      | MEF\
        \ 134   | Description                                                    \
        \                                              |\n| ---------- | ---------\
        \ | ------------------------------------------------------------------------------------------------------------\
        \ |\n| `onCycle`  | On_Cycle  | Bill created as a result of the normal Invoicing\
        \ Cycle                                                       | \n| `offCycle`\
        \ | Off_Cycle | Bill created outside the normal Invoicing Cycle.  This may\
        \ be based on a Buyer request or for other reasons. |\n"
      enum:
      - onCycle
      - offCycle
      type: string
    CustomerBillStateType:
      description: |
        The state of the Bill.

        | state                     | MEF 134 name               | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               |
        | -----------------------   | ----------------------     | ------------------------------------------------------------------------------------------------------------------------------|
        | `generated`               | GENERATED                  | A Bill that has been created based on the completion of an Billing Cycle and an Bill Notification has been sent to the Buyer. |
        | `paymentDue`              | PAYMENT_DUE                | The Seller has completed their dispute process and they are expecting payment from the Buyer                                  |
        | `settled`                 | SETTLED                    | A Bill for which all payment due has been received or for which payment is due.                                               |                                            |
      enum:
      - generated
      - paymentDue
      - settled
      type: string
    CustomerBill_Find:
      description: A legal document generated by the Seller to the Buyer relating
        to charges associated to Products provided by the Seller to the Buyer.
      properties:
        id:
          description: An identifier assigned to the Bill by the Seller.
          type: string
        billingAccount:
          $ref: '#/components/schemas/BillingAccountRef'
        billNo:
          description: A number assigned to the Bill by the Seller.
          type: string
        billingPeriod:
          $ref: '#/components/schemas/TimePeriod'
        category:
          $ref: '#/components/schemas/CustomerBillCategory'
        state:
          $ref: '#/components/schemas/CustomerBillStateType'
      required:
      - billNo
      - category
      - id
      - state
      type: object
    Error:
      description: |
        Standard Class used to describe API response error Not intended to be used directly. The `code` in the HTTP header is used as a discriminator for the type of error returned in runtime.
      properties:
        message:
          description: Text that provides mode details and corrective actions related
            to the error. This can be shown to a client user.
          type: string
        reason:
          description: Text that explains the reason for the error. This can be shown
            to a client user.
          maxLength: 255
          type: string
        referenceError:
          description: URL pointing to documentation describing the error
          format: uri
          type: string
      required:
      - reason
      type: object
    Error400:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error400Code'
        required:
        - code
        type: object
      description: Bad Request. (https://tools.ietf.org/html/rfc7231#section-6.5.1)
    Error400Code:
      description: |-
        One of the following error codes:
        - missingQueryParameter: The URI is missing a required query-string parameter
        - missingQueryValue: The URI is missing a required query-string parameter value
        - invalidQuery: The query section of the URI is invalid.
        - invalidBody: The request has an invalid body
      enum:
      - missingQueryParameter
      - missingQueryValue
      - invalidQuery
      - invalidBody
      type: string
    Error401:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error401Code'
        required:
        - code
        type: object
      description: Unauthorized.  (https://tools.ietf.org/html/rfc7235#section-3.1)
    Error401Code:
      description: |-
        One of the following error codes:
        - missingCredentials: No credentials provided.
        - invalidCredentials: Provided credentials are invalid or expired
      enum:
      - missingCredentials
      - invalidCredentials
      type: string
    Error403:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error403Code'
        required:
        - code
        type: object
      description: Forbidden. This code indicates that the server understood the request
        but refuses to authorize it. (https://tools.ietf.org/html/rfc7231#section-6.5.3)
    Error403Code:
      description: |-
        This code indicates that the server understood
        the request but refuses to authorize it because
        of one of the following error codes:
        - accessDenied: Access denied
        - forbiddenRequester: Forbidden requester
        - tooManyUsers: Too many users
      enum:
      - accessDenied
      - forbiddenRequester
      - tooManyUsers
      type: string
    Error404:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              The following error code:
              - notFound: A current representation of the target resource not found
            enum:
            - notFound
            type: string
        required:
        - code
        type: object
      description: Resource for the requested path not found. (https://tools.ietf.org/html/rfc7231#section-6.5.4)
    Error422:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error422Code'
          propertyPath:
            description: |
              A pointer to a particular property of the payload that caused the validation issue. It is highly recommended that this property should be used.
              Defined using JavaScript Object Notation (JSON) Pointer (https://tools.ietf.org/html/rfc6901).
            type: string
        required:
        - code
        type: object
      description: Unprocessable entity due to a business validation problem. (https://tools.ietf.org/html/rfc4918#section-11.2)
    Error422Code:
      description: |
        One of the following error codes:
          - missingProperty: The property the Seller has expected is not present in the payload
          - invalidValue: The property has an incorrect value
          - invalidFormat: The property value does not comply with the expected value format
          - referenceNotFound: The object referenced by the property cannot be identified in the Seller system
          - unexpectedProperty: Additional property, not expected by the Seller has been provided
          - tooManyRecords: the number of records to be provided in the response exceeds the Seller's threshold.
          - otherIssue: Other problem was identified (detailed information provided in a reason)
      enum:
      - missingProperty
      - invalidValue
      - invalidFormat
      - referenceNotFound
      - unexpectedProperty
      - tooManyRecords
      - otherIssue
      type: string
    Error500:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              The following error code:
              - internalError: Internal server error - the server encountered an unexpected condition that prevented it from fulfilling the request.
            enum:
            - internalError
            type: string
        required:
        - code
        type: object
      description: Internal Server Error. (https://tools.ietf.org/html/rfc7231#section-6.6.1)
    Error501:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              The following error code:
              - notImplemented: Method not supported by the server
            enum:
            - notImplemented
            type: string
        required:
        - code
        type: object
      description: Not Implemented. Used in case Seller is not supporting an optional
        operation (https://tools.ietf.org/html/rfc7231#section-6.6.2)
    EventSubscription:
      description: Sets the communication endpoint address the service instance must
        use to deliver notification information
      properties:
        id:
          description: Id of the listener
          type: string
        callback:
          description: The callback being registered.
          type: string
        query:
          description: additional data to be passed
          type: string
      required:
      - callback
      - id
      type: object
    EventSubscriptionInput:
      description: Sets the communication endpoint address the service instance must
        use to deliver notification information
      properties:
        callback:
          description: "This callback value must be set to *host* property from Buyer\
            \ Notification API (billingNotification.api.yaml). This property is appended\
            \ with the base path and notification resource path specified in that\
            \ API to construct an URL to which notification is sent. E.g. for \"callback\"\
            : \"http://buyer.com/listenerEndpoint\", the state change event notification\
            \ will be sent to: `http://buyer.com/listenerEndpoint/mefApi/sonata/customerBillManagement/v3/listener/troubleTicketStatusChangeEvent`"
          type: string
        query:
          description: "This attribute is used to define to which type of events to\
            \ register to. Example: \"query\":\"eventType = customerBillCreateEvent\"\
            . To subscribe for more than one event type, put the values separated\
            \ by comma: `eventType=customerBillCreateEvent,customerBillStateChangeEvent`.\
            \ The possible values are enumerated by the 'CustomerBillEventType' in\
            \ billingNotification.api.yaml. An empty query is treated as specifying\
            \ no filters - ending in  subscription for all event types."
          type: string
      required:
      - callback
      type: object
    FieldedAddressRepresentation:
      description: "A type of Address that has a discrete field and value for each\
        \ type of boundary or identifier down to the lowest level of detail. For example\
        \ \"street number\" is one field, \"street name\" is another field, etc."
      properties:
        streetNr:
          description: Number identifying a specific property on a public street.
            It may be combined with streetNrLast for ranged addresses.
          type: string
        streetNrSuffix:
          description: The first street number suffix (in a street number range) or
            the suffix for the street number if there is no range
          type: string
        streetNrLast:
          description: Last number in a range of street numbers allocated to an Address
          type: string
        streetNrLastSuffix:
          description: Last street number suffix for a ranged Address
          type: string
        streetPreDirection:
          description: The direction of the street that appears before the Street
            Name
          type: string
        streetName:
          description: Name of the street or other street type
          type: string
        streetType:
          description: "The type of street (e.g., alley, avenue, boulevard, brae,\
            \ crescent, drive, highway, lane, terrace, parade, place, tarn, way, wharf)"
          type: string
        streetPostDirection:
          description: A modifier denoting a relative direction that appears after
            the Street Name.
          type: string
        poBox:
          description: Number identifying a specific location in a post office.
          type: string
        locality:
          description: An area of defined or undefined boundaries within a local authority
            or other legislatively defined area.
          type: string
        city:
          description: City in which the Address is located.
          type: string
        postcode:
          description: A descriptor for a postal delivery area used to speed and simplify
            the delivery of mail (also known as zip code)
          type: string
        postcodeExtension:
          description: "The extension used on a postal code. Note: there are different\
            \ use codes for this attribute depending upon the country."
          type: string
        stateOrProvince:
          description: The State or Province in which the Address is located.
          type: string
        countryCode:
          description: "Country in which the Address is located, defined using two\
            \ characters as defined in ISO 3166"
          maxLength: 2
          minLength: 2
          type: string
        subUnit:
          description: The Sub Unit represented as a list. This is a list to allow
            complex sub-unit information such as SUITE 42 ROOM A
          items:
            $ref: '#/components/schemas/SubUnit'
          type: array
        buildingName:
          description: |
            The well-known name of a building that is located at this Address (e.g., where there is one Address for a campus).
          type: string
        privateStreetNumber:
          description: Street number on a private street within the Address.
          type: string
        privateStreetName:
          description: "Private streets internal to a property (e.g., a university)\
            \ may have internal names that are not recorded by the land title office."
          type: string
        language:
          description: The language in which the address is expressed. It MUST use
            the ISO 639:2023 two letter code 639:2023
          maxLength: 2
          minLength: 2
          type: string
      type: object
    FinancialAccountRef:
      description: A Financial Account within the Seller.
      properties:
        id:
          description: An identifier for the Financial Account that is unique within
            the Seller and is assigned by the Seller.
          type: string
        href:
          description: Unique reference of the account
          type: string
        name:
          description: The name of the Financial Account.
          type: string
        type:
          description: The type of the Financial Account.
          type: string
      required:
      - id
      type: object
    MEFPriceType:
      description: The type of charge related to the Bill Item.
      enum:
      - recurring
      - nonRecurring
      - usageBased
      type: string
    MEFProductOrderItemRef:
      description: It's a ProductOrder item
      properties:
        productOrderHref:
          description: Reference of the related ProductOrder.
          type: string
        productOrderId:
          description: Unique identifier of a ProductOrder.
          type: string
        productOrderItemId:
          description: Id of an Item within the Product Order
          type: string
      required:
      - productOrderId
      - productOrderItemId
      type: object
    Money:
      description: A base value business entity used to represent money
      properties:
        unit:
          description: Currency (ISO4217 norm uses 3 letters to define the currency)
          type: string
        value:
          description: A positive floating point number
          format: float
          type: number
      required:
      - unit
      - value
      type: object
    PaymentItem:
      description: A payment that has been received.
      properties:
        id:
          description: An identifier for the payment that is unique within the Buyer
            Billing Account and is assigned by the Seller.
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentDate:
          description: The Date the payment was received.
          format: date-time
          type: string
      required:
      - id
      type: object
    PaymentMethod:
      description: The specific means of payment.
      enum:
      - check
      - wireTransfer
      - electronic
      - cash
      - other
      type: string
    ProductRef:
      properties:
        id:
          description: Unique identifier of a related entity.
          type: string
        href:
          description: Reference of the related entity.
          type: string
      required:
      - id
      type: object
    RelatedContactInformation:
      description: Contact data for a person or organization that is involved in the
        product offering qualification. In a given context it is always specified
        by the Seller (e.g. Seller Contact Information) or by the Buyer.
      properties:
        role:
          description: A role of the particular contact in the request
          type: string
        number:
          description: Phone number
          type: string
        emailAddress:
          description: Email address
          type: string
        postalAddress:
          $ref: '#/components/schemas/FieldedAddressRepresentation'
        organization:
          description: The organization or company that the contact belongs to
          type: string
        name:
          description: Name of the contact
          type: string
        numberExtension:
          description: Phone number extension
          type: string
      required:
      - emailAddress
      - name
      - number
      - role
      type: object
    SubUnit:
      description: Allows for sub unit identification
      properties:
        subUnitNumber:
          description: "The discriminator used for the subunit, often just a simple\
            \ number but may also be a range."
          type: string
        subUnitType:
          description: "The type of subunit e.g. BERTH, FLAT, PIER, SUITE, SHOP, TOWER,\
            \ UNIT, WHARF."
          type: string
      required:
      - subUnitNumber
      - subUnitType
      type: object
    TaxItem:
      description: A tax item is created for each tax rate and tax type used in the
        bill.
      properties:
        taxCategory:
          description: The Tax Category for this tax item.
          type: string
        taxRate:
          description: The Tax Rate for this Tax Item.
          format: float
          type: number
        taxAmount:
          $ref: '#/components/schemas/Money'
      type: object
    TimePeriod:
      description: "A period of time, either as a deadline (endDateTime only) a startDateTime\
        \ only, or both"
      properties:
        endDateTime:
          description: The date the Billing Period ended.
          format: date-time
          type: string
        startDateTime:
          description: The date the Billing Period started.
          format: date-time
          type: string
      type: object
  securitySchemes:
    oauth2MEFLSOAPI:
      description: Default m2m client code
      flows:
        clientCredentials:
          refreshUrl: http://mef.net/example/refresh
          scopes:
            default: default scope
          tokenUrl: http://mef.net/example/token
      type: oauth2
