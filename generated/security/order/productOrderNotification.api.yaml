openapi: 3.0.1
info:
  description: "**This file forms part of MEF 123.1** \n\n**This draft represents\
    \ MEF work in progress and is subject to change.**\n\nThis API implements Business\
    \ Requirements described in MEF 57.2 and MEF 57.2.1\n\nProduct Order Management\
    \ allows the Buyer to request the Seller to initiate and complete the\nfulfillment\
    \ process of an installation of a Product Offering, an update to\nan existing\
    \ Product, or a disconnect of an existing Product at the address\ndefined by the\
    \ Buyer.\n\nList of supported Use Cases:\n\n- Send Notifications\n\n- Initiate\
    \ Charge\n\nCopyright 2024 MEF Forum and its contributors.\n\nThis file includes\
    \ content based on the TM Forum Product Order API (TMF622\nv4.0.0) available at\
    \ https://github.com/tmforum-apis/TMF622_ProductOrder,\nwhich is licensed by the\
    \ TM Forum under the Apache License version 2.0. Such\ncontent has been modified\
    \ by the MEF Forum and its contributors.\n"
  title: Product Ordering Notification
  version: 11.0.0-RC
servers:
- url: "https://{serverBase}/mefApi/sonata/productOrderingNotification/v11/"
  variables:
    serverBase:
      default: mef.net
      description: The base of Buyer's URL.
security:
- oauth2MEFLSOAPI:
  - default
tags:
- description: |
    The Seller's endpoint to send particular event types notifications to.
  name: Notification listeners
paths:
