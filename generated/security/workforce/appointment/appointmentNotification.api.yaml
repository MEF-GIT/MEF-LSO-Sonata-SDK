openapi: 3.0.1
info:
  description: "**This file forms part of MEF 137.1**\n\n**This draft represents MEF\
    \ work in progress and is subject to change.**\n\n**This API implements Business\
    \ Requirements described in MEF 113.**\n\nAn Appointment is an arrangement to\
    \ do something or meet someone at a  particular time and place. It is previously\
    \ made during an interaction  or may be necessary to solve a customer problem\
    \ or to deliver a product  order item. The appointment API goal is to manage an\
    \ appointment with  all the necessary characteristics. \n\nList of supported use\
    \ cases:\n- Send Appointment Notification\n\nCopyright 2025 MEF Forum and its\
    \ contributors\n\nThis file includes content based on the TM Forum Appointment\
    \ Management API (TMF646 v4.0.0) available at https://github.com/tmforum-apis/TMF646_AppointmentManagement,\
    \ which is licensed by the TM Forum under the Apache License version 2.0. Such\
    \ content has been modified by the MEF Forum and its contributors.\n"
  title: Appointment Management Notification
  version: 3.0.0-RC
servers:
- url: "https://{serverBase}/mefApi/sonata/appointmentNotification/v3/"
  variables:
    serverBase:
      default: mef.net
      description: The base of Buyer's URL.
security:
- oauth2MEFLSOAPI:
  - default
tags:
- description: |
    The Buyer's endpoint to send particular event types notifications to.
  name: Notification listeners
paths:
  /listener/appointmentAttributeValueChangeEvent:
    post:
      description: Client listener for receiving the appointmentAttributeValueChangeEvent
        notification
      operationId: listenToAppointmentAttributeValueChangeEvent
      parameters:
      - description: The unique identifier of the organization that is acting as the
          Buyer. MUST be specified in the request when the requester represents more
          than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          Seller. MUST be specified in the request when the responding entity represents
          more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/AppointmentAttributeValueChangeEvent'
        description: The event data
        required: true
      responses:
        "204":
          description: No Content (https://tools.ietf.org/html/rfc7231#section-6.3.5)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - listenToAppointmentAttributeValueChangeEvent
      summary: Client listener for entity appointmentAttributeValueChangeEvent
      tags:
      - Notification listeners
  /listener/appointmentStatusChangeEvent:
    post:
      description: Client listener for receiving the appointmentStatusChangeEvent
        notification
      operationId: listenToAppointmentStatusChangeEvent
      parameters:
      - description: The unique identifier of the organization that is acting as the
          Buyer. MUST be specified in the request when the requester represents more
          than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          Seller. MUST be specified in the request when the responding entity represents
          more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/AppointmentStatusChangeEvent'
        description: The event data
        required: true
      responses:
        "204":
          description: No Content (https://tools.ietf.org/html/rfc7231#section-6.3.5)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - listenToAppointmentStatusChangeEvent
      summary: Client listener for entity appointmentStatusChangeEvent
      tags:
      - Notification listeners
components:
  schemas:
    AppointmentAttributeValueChangeEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - appointmentAttributeValueChangeEvent
            type: string
          event:
            $ref: '#/components/schemas/AppointmentAttributeValueChangeEventPayload'
        required:
        - event
        - eventType
        type: object
    AppointmentAttributeValueChangeEventPayload:
      description: The identifier of the Appointment is subject of this event.
      properties:
        id:
          description: ID of the Appointment attributed by quoting system
          type: string
        href:
          description: Hyperlink to access the Appointment
          type: string
      required:
      - id
      type: object
    AppointmentStatusChangeEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - appointmentStatusChangeEvent
            type: string
          event:
            $ref: '#/components/schemas/AppointmentStatusChangeEventPayload'
        required:
        - event
        - eventType
        type: object
    AppointmentStatusChangeEventPayload:
      description: The identifier of the Product Offering being subject of this event.
      properties:
        id:
          description: ID of the Product Offering attributed by the Seller
          type: string
        href:
          description: Hyperlink to access the Product Offering
          format: uri
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatusType'
      required:
      - id
      - status
      type: object
    AppointmentStatusType:
      description: |
        Valid values for the lifecycle status of the appointment.

        | status                  | MEF 113 name           | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               |
        | ----------------------- | ---------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
        | `confirmed`             | SCHEDULED              | The Buyer has negotiated and scheduled the Appointment with the Seller.                                                                                                                                                                                                                                                                                                                                                                                                                                                   |
        | `inProgress`            | IN_PROGRESS            | The Appointment can no longer be cancelled (point of no return), this is up to the Seller's discretion.                         |
        | `cancelled`             | CANCELLED              | The Appointment was cancelled by the Buyer or the Seller determined that an Appointment was not required.  This is a terminal state.                                                                                                                                                                                                                                                                                                                                                                                      |
        | `missed`                | MISSED                 | The Appointment did not take place, because of a Seller related issue. For example, no Seller Technician was available on the date of the appointment                                                                                                                                                                                                                                                                                                                                                                     |
        | `failed`                | FAILED                 | The Appointment did not take place, because of an issue with the Buy-er. For example, Seller Technician was unable to get to the Appointment due to an incorrect location or unable to get access to the Buyer`s site. This is a terminal state                                                                                                                                                                                                                                                                           |
        | `completed`             | COMPLETED              | The Appointment took place as scheduled. This is a terminal state.                                                                                                                                                                                                                                                                                                                                                                                                                                                        |
      enum:
      - confirmed
      - inProgress
      - cancelled
      - missed
      - failed
      - completed
      type: string
    Error:
      description: |
        Standard Class used to describe API response error Not intended to be used directly. The `code` in the HTTP header is used as a discriminator for the type of error returned in runtime.
      properties:
        reason:
          description: Text that explains the reason for the error. This can be shown
            to a client user.
          maxLength: 255
          type: string
        message:
          description: Text that provides mode details and corrective actions related
            to the error. This can be shown to a client user.
          type: string
        referenceError:
          description: URL pointing to documentation describing the error
          format: uri
          type: string
      required:
      - reason
      type: object
    Error400:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error400Code'
        required:
        - code
        type: object
      description: Bad Request. (https://tools.ietf.org/html/rfc7231#section-6.5.1)
    Error400Code:
      description: |-
        One of the following error codes:
        - missingQueryParameter: The URI is missing a required query-string parameter
        - missingQueryValue: The URI is missing a required query-string parameter value
        - invalidQuery: The query section of the URI is invalid.
        - invalidBody: The request has an invalid body
      enum:
      - missingQueryParameter
      - missingQueryValue
      - invalidQuery
      - invalidBody
      type: string
    Error401:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error401Code'
        required:
        - code
        type: object
      description: Unauthorized.  (https://tools.ietf.org/html/rfc7235#section-3.1)
    Error401Code:
      description: |-
        One of the following error codes:
        - missingCredentials: No credentials provided.
        - invalidCredentials: Provided credentials are invalid or expired
      enum:
      - missingCredentials
      - invalidCredentials
      type: string
    Error403:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error403Code'
        required:
        - code
        type: object
      description: Forbidden. This code indicates that the server understood the request
        but refuses to authorize it. (https://tools.ietf.org/html/rfc7231#section-6.5.3)
    Error403Code:
      description: |-
        This code indicates that the server understood
        the request but refuses to authorize it because
        of one of the following error codes:
        - accessDenied: Access denied
        - forbiddenRequester: Forbidden requester
        - tooManyUsers: Too many users
      enum:
      - accessDenied
      - forbiddenRequester
      - tooManyUsers
      type: string
    Error500:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              The following error code:
              - internalError: Internal server error - the server encountered an unexpected condition that prevented it from fulfilling the request.
            enum:
            - internalError
            type: string
        required:
        - code
        type: object
      description: Internal Server Error. (https://tools.ietf.org/html/rfc7231#section-6.6.1)
    Event:
      description: Event class is used to describe information structure used for
        notification.
      properties:
        eventId:
          description: Id of the event
          type: string
        eventTime:
          description: Date-time when the event occurred
          format: date-time
          type: string
        eventType:
          description: The type of the notification.
          type: string
        event:
          description: The event linked to the involved resource object
          type: object
      required:
      - event
      - eventId
      - eventTime
      - eventType
      type: object
  securitySchemes:
    oauth2MEFLSOAPI:
      description: Default m2m client code
      flows:
        clientCredentials:
          refreshUrl: http://mef.net/example/refresh
          scopes:
            default: default scope
          tokenUrl: http://mef.net/example/token
      type: oauth2
