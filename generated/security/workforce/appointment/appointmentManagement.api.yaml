openapi: 3.0.1
info:
  description: "**This file forms part of MEF 137.1**\n\n**This draft represents MEF\
    \ work in progress and is subject to change.**\n\n**This API implements Business\
    \ Requirements described in MEF 113.**\n\nAn Appointment is an arrangement to\
    \ do something or meet someone at a  particular time and place. It is previously\
    \ made during an interaction  or may be necessary to solve a customer problem\
    \ or to deliver a product  order item. The appointment API goal is to manage an\
    \ appointment with  all the necessary characteristics. \n\nList of supported use\
    \ cases:\n- Search Appointment Timeslot\n- Create Appointment\n- Retrieve Appointment\
    \ List\n- Retrieve Appointment by Appointment Identifier\n- Patch Appointment\
    \ by Appointment Identifier\n- Cancel Appointment by Appointment Identifier\n\
    - Register for Appointment Notifications\n\nCopyright 2025 MEF Forum and its contributors\n\
    \nThis file includes content based on the TM Forum Appointment Management API\
    \ (TMF646 v4.0.0) available at https://github.com/tmforum-apis/TMF646_AppointmentManagement,\
    \ which is licensed by the TM Forum under the Apache License version 2.0. Such\
    \ content has been modified by the MEF Forum and its contributors.\n"
  title: Appointment Management
  version: 3.0.0-RC
servers:
- url: "https://{serverBase}/mefApi/sonata/appointment/v3/"
  variables:
    serverBase:
      default: mef.net
      description: The base of Seller's URL.
security:
- oauth2MEFLSOAPI:
  - default
tags:
- name: appointment
- name: searchTimeSlot
- name: events subscription
paths:
  /appointment:
    get:
      description: |
        The Buyer requests a list of Appointment from the Seller based on a set of specified filter criteria. The Seller returns a summarized list of Appointments.
      operationId: listAppointment
      parameters:
      - description: A reference to a WorkOrder for which the Appointment is created.
        in: query
        name: workOrderId
        required: false
        schema:
          type: string
      - description: The Date and Time the Appointment is confirmed to start and end
          - greater than.
        in: query
        name: validFor.gt
        required: false
        schema:
          format: date-time
          type: string
      - description: The Date and Time the Appointment is confirmed to start and end
          - lower than.
        in: query
        name: validFor.lt
        required: false
        schema:
          format: date-time
          type: string
      - description: The status of the Appointment.
        in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/AppointmentStatusType'
      - description: A site identifier that is associated with the Appointment.
        in: query
        name: geographicSiteId
        required: false
        schema:
          type: string
      - description: An address identifier that is associated with the Appointment.
        in: query
        name: geographicAddressId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          a Buyer. MUST be specified in the request only when the requester represents
          more than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          Seller. MUST be specified in the request only when responding entity represents
          more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      - description: Requested index for the start of resources to be provided in
          response
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: Requested number of resources to be provided in response
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Appointment_Find'
                type: array
          description: OK. (https://tools.ietf.org/html/rfc7231section-6.3.1)
          headers:
            X-Pagination-Throttled:
              description: |
                Used to indicate that the result page was throttled to maximum possible size  and there are additional results that can be fetched.
              schema:
                type: boolean
            X-Total-Count:
              description: |
                The total number of matching records. E.g. if there are 50 matching records in total, but the request has offset=10 and limit=10, then the X-Total-Count is 50.
              schema:
                type: integer
            X-Result-Count:
              description: The number of records included in the response
              schema:
                type: integer
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to the business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - listAppointment
      summary: List or found Appointment objects
      tags:
      - appointment
    post:
      description: A request initiated by the Buyer to create a Appointment in the
        Seller's system to report an Issue experienced by the Buyer
      operationId: createAppointment
      parameters:
      - description: The unique identifier of the organization that is acting as the
          a Buyer. MUST be specified in the request only when the requester represents
          more than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          Seller. MUST be specified in the request only when responding entity represents
          more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/Appointment_Create'
        description: The Appointment to be created
        required: true
      responses:
        "201":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: Created  (https://tools.ietf.org/html/rfc7231section-6.3.2)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to the business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - createAppointment
      summary: Creates an appointment
      tags:
      - appointment
  /appointment/{id}:
    get:
      description: The Buyer requests detailed information about a single Appointment
        based on the Appointment Identifier.
      operationId: retrieveAppointment
      parameters:
      - description: Unique (within the Seller domain) identifier for the Appointment.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          a Buyer. MUST be specified in the request only when the requester represents
          more than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          Seller. MUST be specified in the request only when responding entity represents
          more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: OK. (https://tools.ietf.org/html/rfc7231section-6.3.1)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - retrieveAppointment
      summary: Retrieves an Appointment by ID
      tags:
      - appointment
    patch:
      description: A request by the Buyer to patch an Appointment created by the Buyer
        in the Seller's system.
      operationId: patchAppointment
      parameters:
      - description: Unique (within the Seller domain) identifier for the Appointment.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          a Buyer. MUST be specified in the request only when the requester represents
          more than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          Seller. MUST be specified in the request only when responding entity represents
          more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/Appointment_Update'
        description: The Appointment to be updated
        required: true
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: Updated
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "409":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error409'
          description: Not Found
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to the business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - patchAppointment
      summary: Updates partially an Appointment
      tags:
      - appointment
  /appointment/{id}/cancel:
    post:
      description: This operation sends a cancellation request.
      operationId: cancelAppointment
      parameters:
      - description: Unique (within the Seller domain) identifier for the Appointment.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          a Buyer. MUST be specified in the request only when the requester represents
          more than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: |-
          The unique identifier of the organization that is acting as the Seller. MUST be specified in the request only when responding entity
           represents more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Cancelled
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to the business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - cancelAppointment
      summary: Cancels an Appointment
      tags:
      - appointment operations
  /searchTimeSlot:
    post:
      description: A request by the Buyer to find a set of available time slots for
        scheduling or rescheduling an Appointment for a Workorder with a Seller Technician.
      operationId: createSearchTimeSlot
      parameters:
      - description: The unique identifier of the organization that is acting as the
          a Buyer. MUST be specified in the request only when the requester represents
          more than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          Seller. MUST be specified in the request only when responding entity represents
          more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/SearchTimeSlot_Create'
        description: The Appointment to be created
        required: true
      responses:
        "201":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SearchTimeSlot'
          description: Created  (https://tools.ietf.org/html/rfc7231section-6.3.2)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to the business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - createSearchTimeSlot
      summary: Creates a SearchTimeSlot
      tags:
      - searchTimeSlot
  /hub:
    post:
      description: The Buyer requests to subscribe to Appointment Notifications.
      operationId: registerListener
      parameters:
      - description: The unique identifier of the organization that is acting as the
          a Buyer. MUST be specified in the request only when the requester represents
          more than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          Seller. MUST be specified in the request only when responding entity represents
          more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/EventSubscriptionInput'
        description: Data containing the callback endpoint to deliver the information
        required: true
      responses:
        "201":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          description: Subscribed  (https://tools.ietf.org/html/rfc7231section-6.3.2)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "422":
          content:
            application/json;charset=utf-8:
              schema:
                items:
                  $ref: '#/components/schemas/Error422'
                type: array
          description: Unprocessable entity due to the business validation problems
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - registerListener
      summary: Allows the Buyer to register to Appointment status change notifications
      tags:
      - events subscription
  /hub/{id}:
    delete:
      description: The Buyer requests to unsubscribe from Appointment Notifications
      operationId: unregisterListener
      parameters:
      - description: The id of the EventSubscription
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          a Buyer. MUST be specified in the request only when the requester represents
          more than one Buyer.
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: The unique identifier of the organization that is acting as the
          Seller. MUST be specified in the request only when responding entity represents
          more than one Seller.
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Deleted (https://tools.ietf.org/html/rfc7231section-6.3.5)
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - unregisterListener
      summary: Unregister a listener
      tags:
      - events subscription
    get:
      description: This operation retrieves a hub entity.
      operationId: retrieveHub
      parameters:
      - description: Identifier of the Hub
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: "The unique identifier of the organization that is acting as\
          \ the a Buyer. MUST be specified in the request only when the requester\
          \ represents more than one Buyer. Reference: MEF 57.2 (Sn 9.18)"
        in: query
        name: buyerId
        required: false
        schema:
          type: string
      - description: "The unique identifier of the organization that is acting as\
          \ the Seller. MUST be specified in the request only when responding entity\
          \  represents more than one Seller. Reference: MEF 57.2 (Sn 9.18)"
        in: query
        name: sellerId
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/EventSubscription'
          description: Success
        "400":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
          description: Bad Request
        "401":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
          description: Unauthorized
        "403":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
          description: Forbidden
        "404":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error404'
          description: Not Found
        "500":
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
          description: Internal Server Error
      security:
      - oauth2MEFLSOAPI:
        - retrieveHub
      summary: Retrieves a Hub by ID
      tags:
      - events subscription
components:
  schemas:
    Appointment:
      description: "In the context of MEF 113 document, denotes an arrangement between\
        \ the Buyer and Seller for a Seller Technician to meet with the Buyer at a\
        \ specified time and place."
      properties:
        id:
          description: Unique identifier of the appointment
          type: string
        href:
          description: Unique URI used to access to the appointment resource
          type: string
        attachment:
          description: "Attachments to the Appointment, such as a file, screenshot\
            \ or embedded content."
          items:
            $ref: '#/components/schemas/AttachmentValue'
          type: array
        note:
          description: Notes describing the purpose of and the results of the Appointment
          items:
            $ref: '#/components/schemas/Note'
          type: array
        relatedPlace:
          $ref: '#/components/schemas/RelatedPlaceRefOrQuery'
        status:
          $ref: '#/components/schemas/AppointmentStatusType'
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        relatedContactInformation:
          description: "Party playing a role in this Appointment. The 'role' is to\
            \ specify the type of contact as specified in MEF 113:\nAppointment Place\
            \ Contact (role=appointmentPlaceContact) - The site contact(s) that the\
            \ Seller Technician may need to contact in order to get access to the\
            \ Appointment Place during the Appointment. This could be an end-user,\
            \ security personnel or any authorized person \nBuyer Appointment Contact\
            \ (role=buyerAppointmentContact)- The Buyer contact(s) assigned to and\
            \ responsible for the Appointment.\nSeller Appointment Contact (role=sellerAppointmentContact)\
            \ - The Seller contact(s) assigned to and responsible for the Appointment."
          items:
            $ref: '#/components/schemas/RelatedContactInformation'
          minItems: 1
          type: array
        workOrder:
          $ref: '#/components/schemas/WorkOrderRef'
      required:
      - id
      - relatedContactInformation
      - relatedPlace
      - status
      - validFor
      - workOrder
      type: object
    AppointmentStatusType:
      description: |
        Valid values for the lifecycle status of the appointment.

        | status                  | MEF 113 name           | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               |
        | ----------------------- | ---------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
        | `confirmed`             | SCHEDULED              | The Buyer has negotiated and scheduled the Appointment with the Seller.                                                                                                                                                                                                                                                                                                                                                                                                                                                   |
        | `inProgress`            | IN_PROGRESS            | The Appointment can no longer be cancelled (point of no return), this is up to the Seller's discretion.                         |
        | `cancelled`             | CANCELLED              | The Appointment was cancelled by the Buyer or the Seller determined that an Appointment was not required.  This is a terminal state.                                                                                                                                                                                                                                                                                                                                                                                      |
        | `missed`                | MISSED                 | The Appointment did not take place, because of a Seller related issue. For example, no Seller Technician was available on the date of the appointment                                                                                                                                                                                                                                                                                                                                                                     |
        | `failed`                | FAILED                 | The Appointment did not take place, because of an issue with the Buy-er. For example, Seller Technician was unable to get to the Appointment due to an incorrect location or unable to get access to the Buyer`s site. This is a terminal state                                                                                                                                                                                                                                                                           |
        | `completed`             | COMPLETED              | The Appointment took place as scheduled. This is a terminal state.                                                                                                                                                                                                                                                                                                                                                                                                                                                        |
      enum:
      - confirmed
      - inProgress
      - cancelled
      - missed
      - failed
      - completed
      type: string
    Appointment_Create:
      description: "In the context of MEF 113 document, denotes an arrangement between\
        \ the Buyer and Seller for a Seller Technician to meet with the Buyer at a\
        \ specified time and place.'"
      properties:
        attachment:
          description: "Attachments to the Appointment, such as a file, screen shot\
            \ or embedded content."
          items:
            $ref: '#/components/schemas/AttachmentValue'
          type: array
        note:
          description: Notes describing the purpose of and the results of the Appointment
          items:
            $ref: '#/components/schemas/Note'
          type: array
        relatedContactInformation:
          description: |-
            Party playing a role in this Appointment. The 'role' is to specify the type of contact as specified in MEF 113:
            Appointment Place Contact (role=appointmentPlaceContact) - The site contact(s) that the Seller Technician may need to contact in order to get access to the Appointment Place during the Appointment. This could be an end-user, security personnel or any authorized person Buyer Appointment Contact (role=buyerAppointmentContact)- The Buyer contact(s) assigned to and responsible for the Appointment. Seller Appointment Contact (role=sellerAppointmentContact) - The Seller contact(s) assigned to and responsible for the Appointment.
          items:
            $ref: '#/components/schemas/RelatedContactInformation'
          minItems: 1
          type: array
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        workOrder:
          $ref: '#/components/schemas/WorkOrderRef'
      required:
      - relatedContactInformation
      - validFor
      - workOrder
      type: object
    Appointment_Find:
      description: "In the context of MEF 113 document, denotes an arrangement between\
        \ the Buyer and Seller for a Seller Technician to meet with the Buyer at a\
        \ specified time and place."
      properties:
        id:
          description: Unique identifier of the appointment
          type: string
        href:
          description: Unique URI used to access to the appointment resource
          type: string
        relatedPlace:
          $ref: '#/components/schemas/RelatedPlaceRefOrQuery'
        status:
          $ref: '#/components/schemas/AppointmentStatusType'
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        workOrder:
          $ref: '#/components/schemas/WorkOrderRef'
      required:
      - id
      - relatedPlace
      - status
      - validFor
      - workOrder
      type: object
    Appointment_Update:
      description: "In the context of MEF 113 document, denotes an arrangement between\
        \ the Buyer and Seller for a Seller Technician to meet with the Buyer at a\
        \ specified time and place."
      properties:
        attachment:
          description: "Attachments to the Appointment, such as a file, screen shot\
            \ or embedded content."
          items:
            $ref: '#/components/schemas/AttachmentValue'
          type: array
        note:
          description: Notes describing the purpose of and the results of the Appointment.
          items:
            $ref: '#/components/schemas/Note'
          type: array
        relatedPlace:
          $ref: '#/components/schemas/RelatedPlaceRefOrQuery'
        relatedContactInformation:
          description: "Party playing a role in this Appointment. The 'role' is to\
            \ specify the type of contact as specified in MEF 113:\nAppointment Place\
            \ Contact (role=appointmentPlaceContact) - The site contact(s) that the\
            \ Seller Technician may need to contact in order to get access to the\
            \ Appointment Place during the Appointment. This could be an end-user,\
            \ security personnel or any authorized person \nBuyer Appointment Contact\
            \ (role=buyerAppointmentContact)- The Buyer contact(s) assigned to and\
            \ responsible for the Appointment.\nSeller Appointment Contact (role=sellerAppointmentContact)\
            \ - The Seller contact(s) assigned to and responsible for the Appointment."
          items:
            $ref: '#/components/schemas/RelatedContactInformation'
          minItems: 1
          type: array
        validFor:
          $ref: '#/components/schemas/TimePeriod'
      type: object
    AttachmentValue:
      description: "Complements the description of an element (for instance a product)\
        \ through video, pictures..."
      properties:
        author:
          description: The name of the person or organization who added the Attachment.
          type: string
        creationDate:
          description: The date the Attachment was added.
          format: date-time
          type: string
        description:
          description: A narrative text describing the content of the attachment
          type: string
        mimeType:
          description: "Attachment mime type such as extension file for video, picture\
            \ and document"
          type: string
        name:
          description: The name of the attachment
          type: string
        size:
          $ref: '#/components/schemas/MEFByteSize'
        source:
          $ref: '#/components/schemas/MEFBuyerSellerType'
        url:
          description: URL where the attachment is located.
          type: string
      required:
      - author
      - creationDate
      - name
      - source
      - url
      type: object
    ContactInformation:
      description: Contact data for a person or organization that is involved in the
        product offering qualification. In a given context it is always specified
        by the Seller (e.g. Seller Contact Information) or by the Buyer.
      properties:
        number:
          description: Phone number
          type: string
        emailAddress:
          description: Email address
          type: string
        postalAddress:
          $ref: '#/components/schemas/FieldedAddressRepresentation'
        organization:
          description: The organization or company that the contact belongs to
          type: string
        name:
          description: Name of the contact
          type: string
        numberExtension:
          description: Phone number extension
          type: string
      required:
      - emailAddress
      - name
      - number
      type: object
    DataSizeUnit:
      description: The unit of measure in the data size.
      enum:
      - BYTES
      - KBYTES
      - MBYTES
      - GBYTES
      - TBYTES
      - PBYTES
      - EBYTES
      - ZBYTES
      - YBYTES
      type: string
    Error:
      description: |
        Standard Class used to describe API response error Not intended to be used directly. The `code` in the HTTP header is used as a discriminator for the type of error returned in runtime.
      properties:
        reason:
          description: Text that explains the reason for the error. This can be shown
            to a client user.
          maxLength: 255
          type: string
        message:
          description: Text that provides mode details and corrective actions related
            to the error. This can be shown to a client user.
          type: string
        referenceError:
          description: URL pointing to documentation describing the error
          format: uri
          type: string
      required:
      - reason
      type: object
    Error400:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error400Code'
        required:
        - code
        type: object
      description: Bad Request. (https://tools.ietf.org/html/rfc7231#section-6.5.1)
    Error400Code:
      description: |-
        One of the following error codes:
        - missingQueryParameter: The URI is missing a required query-string parameter
        - missingQueryValue: The URI is missing a required query-string parameter value
        - invalidQuery: The query section of the URI is invalid.
        - invalidBody: The request has an invalid body
      enum:
      - missingQueryParameter
      - missingQueryValue
      - invalidQuery
      - invalidBody
      type: string
    Error401:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error401Code'
        required:
        - code
        type: object
      description: Unauthorized.  (https://tools.ietf.org/html/rfc7235#section-3.1)
    Error401Code:
      description: |-
        One of the following error codes:
        - missingCredentials: No credentials provided.
        - invalidCredentials: Provided credentials are invalid or expired
      enum:
      - missingCredentials
      - invalidCredentials
      type: string
    Error403:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error403Code'
        required:
        - code
        type: object
      description: Forbidden. This code indicates that the server understood the request
        but refuses to authorize it. (https://tools.ietf.org/html/rfc7231#section-6.5.3)
    Error403Code:
      description: |-
        This code indicates that the server understood
        the request but refuses to authorize it because
        of one of the following error codes:
        - accessDenied: Access denied
        - forbiddenRequester: Forbidden requester
        - tooManyUsers: Too many users
      enum:
      - accessDenied
      - forbiddenRequester
      - tooManyUsers
      type: string
    Error404:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              The following error code:
              - notFound: A current representation of the target resource not found
            enum:
            - notFound
            type: string
        required:
        - code
        type: object
      description: Resource for the requested path not found. (https://tools.ietf.org/html/rfc7231#section-6.5.4)
    Error409:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              The following error code:
              - conflict: The client has provided a value whose semantics are not appropriate for the property.
            enum:
            - conflict
            type: string
        required:
        - code
        type: object
      description: Conflict (https://datatracker.ietf.org/doc/html/rfc7231#section-6.5.8)
    Error422:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            $ref: '#/components/schemas/Error422Code'
          propertyPath:
            description: |
              A pointer to a particular property of the payload that caused the validation issue. It is highly recommended that this property should be used.
              Defined using JavaScript Object Notation (JSON) Pointer (https://tools.ietf.org/html/rfc6901).
            type: string
        required:
        - code
        type: object
      description: Unprocessable entity due to a business validation problem. (https://tools.ietf.org/html/rfc4918#section-11.2)
    Error422Code:
      description: |
        One of the following error codes:
          - missingProperty: The property the Seller has expected is not present in the payload
          - invalidValue: The property has an incorrect value
          - invalidFormat: The property value does not comply with the expected value format
          - referenceNotFound: The object referenced by the property cannot be identified in the Seller system
          - unexpectedProperty: Additional property, not expected by the Seller has been provided
          - tooManyRecords: the number of records to be provided in the response exceeds the Seller's threshold.
          - otherIssue: Other problem was identified (detailed information provided in a reason)
      enum:
      - missingProperty
      - invalidValue
      - invalidFormat
      - referenceNotFound
      - unexpectedProperty
      - tooManyRecords
      - otherIssue
      type: string
    Error500:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          code:
            description: |-
              The following error code:
              - internalError: Internal server error - the server encountered an unexpected condition that prevented it from fulfilling the request.
            enum:
            - internalError
            type: string
        required:
        - code
        type: object
      description: Internal Server Error. (https://tools.ietf.org/html/rfc7231#section-6.6.1)
    EventSubscription:
      description: Sets the communication endpoint address the service instance must
        use to deliver notification information
      properties:
        callback:
          description: The value provided by the Buyer in `EventSubscriptionInput`
            during notification registration
          type: string
        id:
          description: An identifier of the event subscription assigned by the Seller
            when a resource is created.
          type: string
        query:
          description: This attribute is used to define notification registration
            constraints.
          type: string
      required:
      - callback
      - id
      type: object
    EventSubscriptionInput:
      description: This class is used to register for Notifications.
      properties:
        callback:
          description: "This callback value must be set to *host* property from Buyer\
            \ Notification API (appointmentNotification.api.yaml). This property is\
            \ appended with the base path and notification resource path specified\
            \ in that API to construct an URL to which notification is sent. E.g.\
            \ for \"callback\": \"http://buyer.mef.com/listenerEndpoint\", the status\
            \ change event notification will be sent to: `http://buyer.mef.com/listenerEndpoint/mefApi/sonata/appointmentNotification/v3/listener/appointmentStatusChangeEvent`"
          type: string
        query:
          description: "This attribute is used to define to which type of events to\
            \ register to. Example: \"query\":\"eventType = AppointmentStatusChangeEvent\"\
            . To subscribe for more than one event type, put the values separated\
            \ by comma: `eventType=AppointmentStatusChangeEvent,AppointmentResolvedEvent`.\
            \ The possible values are enumerated by the 'AppointmentEventType' in\
            \ AppointmentNotification.api.yaml. An empty query is treated as specifying\
            \ no filters - ending in  subscription for all event types."
          type: string
      required:
      - callback
      type: object
    FieldedAddressRepresentation:
      description: "A type of Address that has a discrete field and value for each\
        \ type of boundary or identifier down to the lowest level of detail. For example\
        \ \"street number\" is one field, \"street name\" is another field, etc."
      properties:
        streetNr:
          description: Number identifying a specific property on a public street.
            It may be combined with streetNrLast for ranged addresses.
          type: string
        streetNrSuffix:
          description: The first street number suffix (in a street number range) or
            the suffix for the street number if there is no range
          type: string
        streetNrLast:
          description: Last number in a range of street numbers allocated to an Address
          type: string
        streetNrLastSuffix:
          description: Last street number suffix for a ranged Address
          type: string
        streetPreDirection:
          description: The direction of the street that appears before the Street
            Name
          type: string
        streetName:
          description: Name of the street or other street type
          type: string
        streetType:
          description: "The type of street (e.g., alley, avenue, boulevard, brae,\
            \ crescent, drive, highway, lane, terrace, parade, place, tarn, way, wharf)"
          type: string
        streetPostDirection:
          description: A modifier denoting a relative direction that appears after
            the Street Name.
          type: string
        poBox:
          description: Number identifying a specific location in a post office.
          type: string
        locality:
          description: An area of defined or undefined boundaries within a local authority
            or other legislatively defined area.
          type: string
        city:
          description: City in which the Address is located.
          type: string
        postcode:
          description: A descriptor for a postal delivery area used to speed and simplify
            the delivery of mail (also known as zip code)
          type: string
        postcodeExtension:
          description: "The extension used on a postal code. Note: there are different\
            \ use codes for this attribute depending upon the country."
          type: string
        stateOrProvince:
          description: The State or Province in which the Address is located.
          type: string
        countryCode:
          description: "Country in which the Address is located, defined using two\
            \ characters as defined in ISO 3166"
          maxLength: 2
          minLength: 2
          type: string
        subUnit:
          description: The Sub Unit represented as a list. This is a list to allow
            complex sub-unit information such as SUITE 42 ROOM A
          items:
            $ref: '#/components/schemas/SubUnit'
          type: array
        buildingName:
          description: |
            The well-known name of a building that is located at this Address (e.g., where there is one Address for a campus).
          type: string
        privateStreetNumber:
          description: Street number on a private street within the Address.
          type: string
        privateStreetName:
          description: "Private streets internal to a property (e.g., a university)\
            \ may have internal names that are not recorded by the land title office."
          type: string
        language:
          description: The language in which the address is expressed. It MUST use
            the ISO 639:2023 two letter code 639:2023
          maxLength: 2
          minLength: 2
          type: string
      type: object
    FormattedAddressRepresentation:
      description: 'A freeform text representation agreed to by the Buyer and Seller. '
      properties:
        formattedAddress:
          description: A formatted Address Representation that contains a non-fielded
            address.
          type: string
        language:
          description: The language in which the address is expressed. Based on ISO
            639:2023
          maxLength: 2
          minLength: 2
          type: string
      required:
      - formattedAddress
      type: object
    GeographicAddressRef:
      allOf:
      - $ref: '#/components/schemas/PlaceRefOrQuery'
      - description: |
          A reference to a Geographic Address resource available through Address Validation API.
        properties:
          href:
            description: |
              Hyperlink to the referenced Address. Hyperlink MAY be used by the Seller in responses. Hyperlink MUST be ignored by the Seller in case it is provided by the Buyer in a request.
            type: string
          id:
            description: Identifier of the referenced Geographic Address. This identifier
              is assigned during a successful address validation request (Geographic
              Address Management API)
            type: string
        required:
        - '@type'
        - id
        type: object
      x-discriminator-value: GeographicAddressRef
    GeographicAddress_Query:
      allOf:
      - $ref: '#/components/schemas/PlaceRefOrQuery'
      - description: A list of representations being a subset of Geographic Address
          entity. This is to be used when providing a list of representations to validate
          a Geographic Address
        minProperties: 2
        properties:
          fieldedAddressRepresentation:
            description: A list of Fielded Address representations
            items:
              $ref: '#/components/schemas/FieldedAddressRepresentation'
            type: array
          formattedAddressRepresentation:
            description: A list of Formatted Address representations
            items:
              $ref: '#/components/schemas/FormattedAddressRepresentation'
            type: array
          geographicPointRepresentation:
            description: A list of Geographic Point Address representations
            items:
              $ref: '#/components/schemas/GeographicPointRepresentation'
            type: array
          labelRepresentation:
            description: A list of Label Address representations
            items:
              $ref: '#/components/schemas/LabelRepresentation'
            type: array
        required:
        - '@type'
        type: object
      x-discriminator-value: GeographicAddress_Query
    GeographicPointRepresentation:
      description: |
        A GeographicPointRepresentation defines a geographic point through coordinates.
      properties:
        spatialRef:
          description: The spatial reference system used to determine the coordinates.
            The system used and the value of this field are to be agreed during the
            onboarding process.
          type: string
        latitude:
          description: The latitude expressed in the format specified by the `spacialRef`
          type: string
        longitude:
          description: The longitude expressed in the format specified by the `spacialRef`
          type: string
        elevation:
          description: The elevation expressed in the format specified by the `spacialRef`
          type: string
      required:
      - latitude
      - longitude
      - spatialRef
      type: object
    GeographicSiteRef:
      allOf:
      - $ref: '#/components/schemas/PlaceRefOrQuery'
      - description: |
          A reference to a Geographic Site resource available through Service Site API
        properties:
          href:
            description: |
              Hyperlink to the referenced Site. Hyperlink MAY be used by the Seller in responses. Hyperlink MUST be ignored by the Seller in case it is provided by the Buyer in a request.
            type: string
          id:
            description: Identifier of the referenced Geographic Site.
            type: string
        required:
        - '@type'
        - id
        type: object
      x-discriminator-value: GeographicSiteRef
    LabelRepresentation:
      description: A unique identifier controlled by a generally accepted independent
        administrative authority that specifies a fixed geographical location.
      properties:
        label:
          description: The unique reference to a Geographic Address assigned by the
            Administrative Authority.
          type: string
        administrativeAuthority:
          description: The organization or standard from the organization that administers
            this Geographic Address Label ensuring it is unique within the Administrative
            Authority.
          type: string
        language:
          description: The language in which the label is expressed. Based on ISO
            639:2023
          maxLength: 2
          minLength: 2
          type: string
      required:
      - administrativeAuthority
      - label
      type: object
    MEFBuyerSellerType:
      description: An enumeration with buyer and seller values.
      enum:
      - buyer
      - seller
      type: string
    MEFByteSize:
      description: A size represented by value and Byte units
      properties:
        amount:
          default: 1
          description: Numeric value in a given unit
          format: float
          type: number
        units:
          $ref: '#/components/schemas/DataSizeUnit'
      type: object
    Note:
      description: Extra information about a given entity. Only useful in processes
        involving human interaction. Not applicable to an automated process.
      properties:
        author:
          description: Author of the note
          type: string
        date:
          description: Date of the note
          format: date-time
          type: string
        id:
          description: "Identifier of the note within its containing entity (may or\
            \ may not be globally unique, depending on provider implementation)"
          type: string
        source:
          $ref: '#/components/schemas/MEFBuyerSellerType'
        text:
          description: Text of the note
          type: string
      required:
      - author
      - date
      - id
      - source
      - text
      type: object
    PlaceRefOrQuery:
      discriminator:
        mapping:
          GeographicAddressRef: '#/components/schemas/GeographicAddressRef'
          GeographicAddress_Query: '#/components/schemas/GeographicAddress_Query'
          GeographicSiteRef: '#/components/schemas/GeographicSiteRef'
        propertyName: '@type'
      properties:
        '@type':
          description: Used to unambiguously designate the class type when using `oneOf`
          enum:
          - GeographicAddressRef
          - GeographicAddress_Query
          - GeographicSiteRef
          type: string
      required:
      - '@type'
      type: object
    RelatedContactInformation:
      description: Contact data for a person or organization that is involved in the
        product offering qualification. In a given context it is always specified
        by the Seller (e.g. Seller Contact Information) or by the Buyer.
      properties:
        role:
          description: The role of the particular contact in the request
          type: string
        number:
          description: Phone number
          type: string
        emailAddress:
          description: Email address
          type: string
        postalAddress:
          $ref: '#/components/schemas/FieldedAddressRepresentation'
        organization:
          description: The organization or company that the contact belongs to
          type: string
        name:
          description: Name of the contact
          type: string
        numberExtension:
          description: Phone number extension
          type: string
      required:
      - emailAddress
      - name
      - number
      - role
      type: object
    RelatedPlaceRefOrQuery:
      description: "Allows pointing to a place by referring to a GeographicAddress,\
        \ GeographicSite, or providing GeographicAddress by value. It also provides\
        \ additional information like the `role` the place plays for given Product\
        \ and `contact` needed access to this place."
      properties:
        place:
          $ref: '#/components/schemas/PlaceRefOrQuery'
        role:
          description: Role of this place. The values that can be specified here are
            described by Product Specification (e.g. "INSTALL_LOCATION").
          type: string
        contact:
          description: The person to call to get access to this place in case such
            access is required to complete the evaluation of this POQ Item.
          items:
            $ref: '#/components/schemas/ContactInformation'
          type: array
      required:
      - place
      - role
      type: object
    SearchTimeSlot:
      description: This task resource is used to retrieve available time slots. One
        of this available time slot is after used to create or reschedule an appointment
      properties:
        availableTimeSlot:
          description: "A set of time slots with the availability of a Seller Technician\
            \ returned by the Seller, which the Buyer may select for creating or rescheduling\
            \ an Appointment."
          items:
            $ref: '#/components/schemas/TimeSlot'
          type: array
        requestedTimeSlot:
          description: "A set of preferred time slots the Buyer is requesting the\
            \ Seller to verify for availability by a Sellers Technician at the Place\
            \ referenced in the Appointment Related Entity. For example Monday thru\
            \ Friday, or a set of specific time slots."
          items:
            $ref: '#/components/schemas/TimeSlot'
          type: array
        workOrder:
          $ref: '#/components/schemas/WorkOrderRef'
      required:
      - availableTimeSlot
      - requestedTimeSlot
      - workOrder
      type: object
    SearchTimeSlot_Create:
      description: This task resource is used to retrieve available time slots. One
        of this available time slot is after used to create or reschedule an appointment
      properties:
        requestedTimeSlot:
          description: "A set of preferred time slots the Buyer is requesting the\
            \ Seller to verify for availability by a Sellers Technician at the Place\
            \ referenced in the Appointment Related Entity. For example Monday thru\
            \ Friday, or a set of specific time slots."
          items:
            $ref: '#/components/schemas/TimeSlot'
          type: array
        workOrder:
          $ref: '#/components/schemas/WorkOrderRef'
      required:
      - requestedTimeSlot
      - workOrder
      type: object
    SubUnit:
      description: Allows for sub unit identification
      properties:
        subUnitNumber:
          description: "The discriminator used for the subunit, often just a simple\
            \ number but may also be a range."
          type: string
        subUnitType:
          description: "The type of subunit e.g. BERTH, FLAT, PIER, SUITE, SHOP, TOWER,\
            \ UNIT, WHARF."
          type: string
      required:
      - subUnitNumber
      - subUnitType
      type: object
    TimePeriod:
      description: "A period of time, either as a deadline (endDateTime only) a startDateTime\
        \ only, or both"
      properties:
        endDateTime:
          description: "End of the time period, using IETC-RFC-3339 format"
          format: date-time
          type: string
        startDateTime:
          description: "Start of the time period, using IETC-RFC-3339 format. If you\
            \ define a start, you must also define an end"
          format: date-time
          type: string
      required:
      - endDateTime
      - startDateTime
      type: object
    TimeSlot:
      properties:
        validFor:
          $ref: '#/components/schemas/TimePeriod'
      required:
      - validFor
      type: object
    WorkOrderRef:
      description: |
        A reference to an WorkOrder resource.
      properties:
        href:
          description: |
            Hyperlink to the referenced WorkOrder.
          type: string
        id:
          description: Identifier of the referenced WorkOrder.
          type: string
      required:
      - id
      type: object
  securitySchemes:
    oauth2MEFLSOAPI:
      description: Default m2m client code
      flows:
        clientCredentials:
          refreshUrl: http://mef.net/example/refresh
          scopes:
