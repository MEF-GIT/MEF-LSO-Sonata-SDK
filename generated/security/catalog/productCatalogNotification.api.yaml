openapi: 3.0.1
info:
  description: "**This file forms part of MEF W142**\n\nThis API implements Business\
    \ Requirements described in MEF W127.1 \nrelated to the notifications that are\
    \ sent by the Seller to the Buyer.\n\n**This specification represents MEF work\
    \ in progress and is subject to\nchange.** \n\nList of supported use cases:\n\
    - Send Event Notification\n\nIt allows the Buyer to receive notifications about\
    \ Product Categories', Product Offerings',\nand Product Specifications' updates.\n\
    This allows the Buyer to be up to date with the Product Catalog that is published\
    \ by the Seller. \nThe Seller may introduce some changes related to Product Catalog\
    \ Elements such as adding new elements \nor modifying their lifecycle that causes\
    \ sending notifications.\n\nCopyright 2024 MEF Forum and its contributors\n\n\
    This file includes content based on the TM Forum Product Catalog API (TMF620 v4.1.0)\
    \ available at https://github.com/tmforum-apis/TMF620_ProductCatalog, which is\
    \ licensed by the TM Forum under the Apache License version 2.0. Such content\
    \ has been modified by the MEF Forum and its contributors.\n"
  title: Product Catalog Notification
  version: 3.0.0-RC
servers:
- url: "https://{serverBase}/mefApi/sonata/productCatalogNotifications/v3/"
  variables:
    serverBase:
      default: mef.net
      description: The base of Buyer's URL.
security:
- oauth2MEFLSOAPI:
  - default
tags:
- description: The Buyer's endpoint to send particular event types notifications to.
  name: Notification listeners
