        - eventType
        type: object
    ProductCategoryEventPayload:
      description: The identifier of the Product Category being subject of this event.
      properties:
        id:
          description: ID of the Product Category attributed by the Seller
          type: string
        href:
          description: Hyperlink to access the Product Category
          format: uri
          type: string
      required:
      - id
      type: object
    ProductOfferingAttributeValueChangeEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - productOfferingAttributeValueChangeEvent
            type: string
          event:
            $ref: '#/components/schemas/ProductOfferingEventPayload'
        required:
        - event
        - eventType
        type: object
    ProductOfferingCreateEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - productCategoryCreateEvent
            type: string
          event:
            $ref: '#/components/schemas/ProductOfferingEventPayload'
        required:
        - event
        - eventType
        type: object
    ProductOfferingEventPayload:
      description: The identifier of the Product Offering being subject of this event.
      properties:
        id:
          description: ID of the Product Offering attributed by the Seller
          type: string
        href:
          description: Hyperlink to access the Product Offering
          format: uri
          type: string
      required:
      - id
      type: object
    ProductOfferingLifecycleStatusType:
      description: |
        | Name         | MEF 127 Name   | Description                                                                                                                                                                                                                                  |
        | ------------ | -------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
        | announced    | ANNOUNCED      | A Product Offering has been defined in the Product Catalog for marketing purposes, but is not yet available for ordering.                                                                                                                    |
        | endOfSale    | END_OF_SALE    | The Product Offering or Product Specification cannot be Installed by any new or existing Buyers, but Buyers may still have Products in use and may modify or delete it, and receive support.                                                 |
        | endOfSupport | END_OF_SUPPORT | When a Product Offering or Product Specification in the `endOfSale` state is no longer supported, the status transitions to `endOfSupport`. Any existing products can no longer be modified, with the only Order action allowed is `delete`. |
        | inTest       | PILOT_BETA     | When a Product Offering or Product Specification starts Pilot/Beta testing, it starts in the `pilotBeta` state .                                                                                                                             |
        | obsolete     | OBSOLETE       | After a Product Offering or Product Specification that is no longer available it transitions to `obsolete` and may be removed at the Seller's discretion from the Product Catalog. This is a final state.                                    |
        | onHold       | ON_HOLD        | A Product Offering or Product Specification that has been `launched`, but is currently not available for Buyers due to supply constraints, product recall, or other issues preventing it from being offered.                                      |
        | launched    | launched      | A new Product Offering or Product Specification is in the `launched` state when it is available for ordering by Buyers.                                                                                                                     |
        | rejected     | REJECTED       | When PILOT_BETA testing fails the Product Offering or Product Specification transitions to the `rejected` state. This is a final state.                                                                                                      |
      enum:
      - announced
      - endOfSale
      - endOfSupport
      - inTest
      - obsolete
      - onHold
      - launched
      - rejected
      type: string
    ProductOfferingStateChangeEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - productCategoryStateChangeEvent
            type: string
          event:
            $ref: '#/components/schemas/ProductOfferingStateChangeEventPayload'
        required:
        - event
        - eventType
        type: object
    ProductOfferingStateChangeEventPayload:
      description: The identifier of the Product Offering being subject of this event.
      properties:
        id:
          description: ID of the Product Offering attributed by the Seller
          type: string
        href:
          description: Hyperlink to access the Product Offering
          format: uri
          type: string
        lifecycleStatus:
          $ref: '#/components/schemas/ProductOfferingLifecycleStatusType'
      required:
      - id
      - lifecycleStatus
      type: object
    ProductSpecificationAttributeValueChangeEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - productSpecificationAttributeValueChangeEvent
            type: string
          event:
            $ref: '#/components/schemas/ProductSpecificationEventPayload'
        required:
        - event
        - eventType
        type: object
    ProductSpecificationCreateEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          eventType:
            description: Indicates the type of the event.
            enum:
            - productCategoryCreateEvent
            type: string
          event:
            $ref: '#/components/schemas/ProductSpecificationEventPayload'
        required:
