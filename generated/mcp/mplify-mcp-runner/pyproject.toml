[project]
name = "mcp-openapi-server"
version = "0.1.0"
description = "Template: expose an OpenAPI spec as an MCP server using FastMCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Template"}]

dependencies = [
  "fastmcp>=2.14.1",
  "httpx>=0.27",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pyfiglet>=0.8.post1",
]

[project.scripts]
mplify-mcp-server = "mcp_openapi_server.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
